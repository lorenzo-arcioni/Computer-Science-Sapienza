<text x="380.0" y="241.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">TG = |G|</text>
<text x="380.0" y="261.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">TI = |G|·(N−1)</text>
<rect x="520.0" y="208.0" width="270.0" height="74.0" fill="#fff" stroke="#9ca3af" stroke-width="1"/>
<text x="655.0" y="241.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">TG = |P|</text>
<text x="655.0" y="261.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">TI = |P|·(N−1)</text>
<rect x="795.0" y="208.0" width="110.0" height="74.0" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/>
