<text x="140.0" y="333.0" text-anchor="middle" font-size="11" fill="#333">open set (multiple template)</text>
<rect x="245.0" y="282.0" width="270.0" height="74.0" fill="#fff" stroke="#9ca3af" stroke-width="1"/>
<text x="380.0" y="315.0" text-anchor="middle" font-size="13" fill="#9ca3af">—</text>
<rect x="520.0" y="282.0" width="270.0" height="74.0" fill="#fff" stroke="#9ca3af" stroke-width="1"/>
<text x="655.0" y="315.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">TG = |G|</text>
<text x="655.0" y="335.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">TI = |G|</text>
<rect x="795.0" y="282.0" width="110.0" height="74.0" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/>
<text x="850.0" y="323.0" text-anchor="middle" font-size="12" fill="#333">6 · 6</text>
<rect x="40.0" y="356.0" width="200.0" height="74.0" fill="#dcfce7" stroke="#9ca3af" stroke-width="1"/>
<text x="140.0" y="389.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Identificazione</text>
<text x="140.0" y="407.0" text-anchor="middle" font-size="11" fill="#333">closed set (CMS, nessuna soglia)</text>
<rect x="245.0" y="356.0" width="270.0" height="74.0" fill="#fff" stroke="#9ca3af" stroke-width="1"/>
<text x="380.0" y="389.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">TA = |P|</text>
<text x="380.0" y="409.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">K = |G|−1</text>
<rect x="520.0" y="356.0" width="270.0" height="74.0" fill="#fff" stroke="#9ca3af" stroke-width="1"/>
<text x="655.0" y="389.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">TA = |P|</text>
<text x="655.0" y="409.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">K = |G|</text>
<rect x="795.0" y="356.0" width="110.0" height="74.0" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/>
<text x="850.0" y="397.0" text-anchor="middle" font-size="12" fill="#333">TA = 6</text>
<text x="40.0" y="460.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#111">Come leggerla</text>
<text x="40.0" y="484.0" text-anchor="start" font-size="12" fill="#444">Single template: ogni cella è un esperimento. Multiple template: un esperimento per identità (minimo del gruppo).</text>
<text x="40.0" y="504.0" text-anchor="start" font-size="12" fill="#444">Con la diagonale (§9) i genuini per riga sono S−1; con due sessioni (§10) sono S, perché il probe non è in gallery.</text>
<text x="40.0" y="524.0" text-anchor="start" font-size="12" fill="#444">Open set: ogni riga conta due volte (scenario genuino + scenario impostore con l'identità rimossa): TG = TI = |G|.</text>
<text x="40.0" y="544.0" text-anchor="start" font-size="12" fill="#444">Esempio: valori (TG · TI) calcolati per la matrice 6×6. Il closed set conta solo a che rango compare l'identità giusta.</text>
</svg>