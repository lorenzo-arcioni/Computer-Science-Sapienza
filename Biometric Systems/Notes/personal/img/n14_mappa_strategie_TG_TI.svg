<text x="380.0" y="167.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">TG = |G|·(S−1)</text>
<text x="380.0" y="187.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">TI = |G|·(N−1)·S</text>
