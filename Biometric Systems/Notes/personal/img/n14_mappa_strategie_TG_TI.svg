<text x="380.0" y="117.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111">§9 · stessa matrice (con diagonale)</text>
<rect x="520.0" y="90.0" width="270.0" height="44.0" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
