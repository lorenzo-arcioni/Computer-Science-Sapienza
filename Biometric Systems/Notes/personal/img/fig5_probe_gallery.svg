<text x="600.0" y="170.0" text-anchor="start" font-size="14" font-weight="700" fill="#111">Una riga (probe p_A2)</text>
<text x="600.0" y="194.0" text-anchor="start" font-size="13" fill="#222">• celle genuine: S = 2   (non S − 1)</text>
<text x="600.0" y="216.0" text-anchor="start" font-size="13" fill="#222">• celle impostore: (N − 1)·S = 4</text>
<text x="600.0" y="262.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#111">Single template (ogni cella è un esperimento)</text>
<text x="600.0" y="286.0" text-anchor="start" font-size="13" fill="#222">TG = |P|·S = 12</text>
<text x="600.0" y="308.0" text-anchor="start" font-size="13" fill="#222">TI = |P|·(N−1)·S = 24</text>
<text x="600.0" y="354.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#111">Multiple template (minimo per gruppo)</text>
<text x="600.0" y="378.0" text-anchor="start" font-size="13" fill="#222">TG = |P| = 6</text>
<text x="600.0" y="400.0" text-anchor="start" font-size="13" fill="#222">TI = |P|·(N−1) = 12</text>
<text x="600.0" y="446.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#111">Perché due sessioni?</text>
<text x="600.0" y="470.0" text-anchor="start" font-size="12.5" fill="#444">Campioni della stessa sessione sono più simili</text>
<text x="600.0" y="488.0" text-anchor="start" font-size="12.5" fill="#444">tra loro: i genuini risulterebbero troppo vicini</text>
<text x="600.0" y="506.0" text-anchor="start" font-size="12.5" fill="#444">e le prestazioni ottimisticamente falsate.</text>
