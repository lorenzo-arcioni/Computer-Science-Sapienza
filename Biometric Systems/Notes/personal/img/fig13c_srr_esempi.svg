<text x="524" y="310" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#555">verde = primo (escluso dal conteggio) · arancione = in N_b · grigio = fuori</text>
<rect x="485.0" y="389.0" width="410" height="82" rx="9" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
<text x="690.0" y="418.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111827" font-weight="700">N_b = {0.25}  →  |N_b| = 1,  |G| = 3 (primo escluso)</text>
<text x="690.0" y="434.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111827">φ = 1 − 1/3 = 0.667</text>
<text x="690.0" y="450.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111827">variante, primo incluso: 1 − 2/4 = 0.50 (non necessario)</text>
<text x="460.0" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#555">Con la convenzione delle slide il Density Ratio ha massimo 1; la scelta del fattore 2 non è stata migliorata da parametri adattivi.</text>
