<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="460.0" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111827" font-weight="700">Proprietà di una metrica: disuguaglianza triangolare e simmetria</text>
<text x="460.0" y="53" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#4b5563">d(x,z) ≤ d(x,y) + d(y,z) · d(x,y) = d(y,x) · una misura che le viola è solo una semimetrica (o nemmeno)</text>
<rect x="20" y="78" width="280" height="420" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="160.0" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#166534" font-weight="700">A · Distanza euclidea</text>
<text x="160.0" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#555">è una metrica</text>
