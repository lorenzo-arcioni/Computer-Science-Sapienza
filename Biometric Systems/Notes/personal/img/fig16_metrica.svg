<rect x="406.7" y="362" width="66.7" height="22" fill="#60a5fa" fill-opacity="0.9"/>
<text x="346" y="378" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fff" font-weight="700">d(x,y) + d(y,z) = 0.60</text>
<rect x="340.0" y="433.0" width="240" height="34" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="460.0" y="454.375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827" font-weight="700">d(x,z) &gt; somma → VIOLATA</text>
<rect x="620" y="78" width="280" height="420" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="760" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b45309" font-weight="700">C · Asimmetria e simmetrizzazione</text>
<text x="760" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#555">d(A,B) ≠ d(B,A) → si media nelle due direzioni</text>
<circle cx="670" cy="230" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="670" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb" font-weight="700">A</text>
<circle cx="850" cy="230" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="850" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb" font-weight="700">B</text>
