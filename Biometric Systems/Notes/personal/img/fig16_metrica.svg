<text x="460.0" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b91c1c" font-weight="700">B · Misura elastica (tipo DTW)</text>
<text x="460.0" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#555">valori ipotetici: semimetrica</text>
