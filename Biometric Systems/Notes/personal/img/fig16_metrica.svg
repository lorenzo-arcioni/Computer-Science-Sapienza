<text x="760" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#166534" font-weight="700" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">d(B,A) = 0.40</text>
<rect x="640.0" y="313.0" width="240" height="54" rx="9" fill="#ffedd5" stroke="#b45309" stroke-width="1.5"/>
<text x="760" y="335.9375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827" font-weight="700">d_sym(A,B) = (d(A,B)+d(B,A)) / 2</text>
<text x="760" y="352.8125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827">= (0.80 + 0.40) / 2 = 0.60</text>
<text x="760" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">d_sym è simmetrica, ma resta una semimetrica</text>
<text x="760" y="418" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">se non rispetta la disuguaglianza triangolare</text>
<text x="460.0" y="526" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222" font-weight="700">Test sulla matrice M6 del §9: 0 triple su 20 violano la disuguaglianza triangolare → è una metrica.</text>
</svg>