<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" font-family="Helvetica, Arial, sans-serif">
<rect width="920" height="540" fill="#ffffff"/>
<text x="460.0" y="32.0" text-anchor="middle" font-size="20" font-weight="700" fill="#111">Identificazione open set (multiple template): due scenari per ogni riga</text>
<text x="460.0" y="54.0" text-anchor="middle" font-size="13" fill="#444">Lista L[i] = una distanza per identità (minimo per gruppo), ordinata in modo crescente · t = 0.35</text>
<text x="40.0" y="86.0" text-anchor="start" font-size="14.5" font-weight="700" fill="#111">Scenario genuino · l'identità del probe (A) è in galleria</text>
<text x="40.0" y="106.0" text-anchor="start" font-size="12.5" fill="#555">k* = 2: prima occorrenza di A nella lista</text>
<rect x="120.0" y="120.0" width="120.0" height="66.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="180.0" y="137.0" text-anchor="middle" font-size="11.5" fill="#555">k = 1</text>
<text x="180.0" y="160.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111">id C</text>
<text x="180.0" y="178.0" text-anchor="middle" font-size="12" fill="#15803d">L[i,1] = 0.21</text>
<rect x="252.0" y="120.0" width="120.0" height="66.0" rx="8" fill="#dcfce7" stroke="#7c3aed" stroke-width="3" stroke-dasharray="6,3"/>
<text x="312.0" y="137.0" text-anchor="middle" font-size="11.5" fill="#555">k = 2</text>
<text x="312.0" y="160.0" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">id A ★</text>
<text x="312.0" y="178.0" text-anchor="middle" font-size="12" fill="#15803d">L[i,2] = 0.27</text>
<rect x="384.0" y="120.0" width="120.0" height="66.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
<text x="444.0" y="137.0" text-anchor="middle" font-size="11.5" fill="#555">k = 3</text>
<text x="444.0" y="160.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111">id D</text>
<text x="444.0" y="178.0" text-anchor="middle" font-size="12" fill="#6b7280">L[i,3] = 0.44</text>
<rect x="516.0" y="120.0" width="120.0" height="66.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
<text x="576.0" y="137.0" text-anchor="middle" font-size="11.5" fill="#555">k = 4</text>
<text x="576.0" y="160.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111">id B</text>
<text x="576.0" y="178.0" text-anchor="middle" font-size="12" fill="#6b7280">L[i,4] = 0.58</text>
<rect x="648.0" y="120.0" width="120.0" height="66.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
<text x="708.0" y="137.0" text-anchor="middle" font-size="11.5" fill="#555">k = 5</text>
<text x="708.0" y="160.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111">id E</text>
<text x="708.0" y="178.0" text-anchor="middle" font-size="12" fill="#6b7280">L[i,5] = 0.71</text>
<line x1="378" y1="114" x2="378" y2="194" stroke="#111" stroke-width="2" stroke-dasharray="6,4"/>
<text x="378.0" y="210.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111">t = 0.35</text>
<rect x="80.0" y="226.0" width="760.0" height="44.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="460.0" y="244.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#222">L[i,k*] = L[i,2] = 0.27 ≤ t   →   DI(t, 2) += 1</text>
<text x="460.0" y="260.4" text-anchor="middle" font-size="12.5" fill="#222">contribuisce a DIR(t,k) per ogni k ≥ 2; DIR(t,1) non cresce perché il rank 1 è un'altra identità</text>
<text x="40.0" y="316.0" text-anchor="start" font-size="14.5" font-weight="700" fill="#111">Scenario impostore · l'identità A viene rimossa dalla galleria</text>
<text x="40.0" y="336.0" text-anchor="start" font-size="12.5" fill="#555">nessuna risposta corretta esiste: qualunque accettazione è un errore</text>
<rect x="120.0" y="350.0" width="120.0" height="66.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="180.0" y="367.0" text-anchor="middle" font-size="11.5" fill="#555">k = 1</text>
<text x="180.0" y="390.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111">id C</text>
<text x="180.0" y="408.0" text-anchor="middle" font-size="12" fill="#15803d">L[i,1] = 0.21</text>
<rect x="252.0" y="350.0" width="120.0" height="66.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
<text x="312.0" y="367.0" text-anchor="middle" font-size="11.5" fill="#555">k = 2</text>
<text x="312.0" y="390.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111">id D</text>
<text x="312.0" y="408.0" text-anchor="middle" font-size="12" fill="#6b7280">L[i,2] = 0.44</text>
<rect x="384.0" y="350.0" width="120.0" height="66.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
<text x="444.0" y="367.0" text-anchor="middle" font-size="11.5" fill="#555">k = 3</text>
<text x="444.0" y="390.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111">id B</text>
<text x="444.0" y="408.0" text-anchor="middle" font-size="12" fill="#6b7280">L[i,3] = 0.58</text>
<rect x="516.0" y="350.0" width="120.0" height="66.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
<text x="576.0" y="367.0" text-anchor="middle" font-size="11.5" fill="#555">k = 4</text>
<text x="576.0" y="390.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111">id E</text>
<text x="576.0" y="408.0" text-anchor="middle" font-size="12" fill="#6b7280">L[i,4] = 0.71</text>
<line x1="246" y1="344" x2="246" y2="424" stroke="#111" stroke-width="2" stroke-dasharray="6,4"/>
<text x="246.0" y="440.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111">t = 0.35</text>
<rect x="80.0" y="446.0" width="760.0" height="44.0" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="460.0" y="464.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#222">L[i,1] = 0.21 ≤ t   →   FA += 1</text>
<text x="460.0" y="480.4" text-anchor="middle" font-size="12.5" fill="#222">altrimenti (L[i,1] > t) → GR += 1</text>
<text x="460.0" y="526.0" text-anchor="middle" font-size="12" fill="#555">TG = |G| e TI = |G|: ogni riga conta una volta come genuina e una volta come impostore</text>
</svg>