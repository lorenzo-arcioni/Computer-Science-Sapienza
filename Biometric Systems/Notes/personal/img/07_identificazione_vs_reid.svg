<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460" role="img" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Identificazione e re-identificazione a confronto</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="459" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="20" y="20" width="310" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="175.0" y="42.0" dy=".35em" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle">Identificazione</text>
<text x="175" y="84" dy=".35em" font-size="12" font-weight="400" fill="#444441" text-anchor="middle">orizzonte temporale medio/lungo</text>
<rect x="50" y="106" width="250" height="54" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="175.0" y="125.44" dy=".35em" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Probe</text>
<text x="175.0" y="144.88" dy=".35em" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">una immagine/campione</text>
<line x1="175" y1="160" x2="175" y2="190" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="50" y="194" width="250" height="54" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="175.0" y="213.44" dy=".35em" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Gallery di identità</text>
<text x="175.0" y="232.88" dy=".35em" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">template con nome o ID</text>
<line x1="175" y1="248" x2="175" y2="278" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="50" y="282" width="250" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="175.0" y="301.44" dy=".35em" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle">Identità precisa</text>
<text x="175.0" y="320.88" dy=".35em" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle">es. ID = 0042</text>
<text x="26" y="364" dy=".35em" font-size="12" font-weight="500" fill="#444441" text-anchor="start">Insieme</text>
<text x="124" y="364" dy=".35em" font-size="12" font-weight="400" fill="#444441" text-anchor="start">open o closed set</text>
<text x="26" y="388" dy=".35em" font-size="12" font-weight="500" fill="#444441" text-anchor="start">Output</text>
<text x="124" y="388" dy=".35em" font-size="12" font-weight="400" fill="#444441" text-anchor="start">un'identità (nome/ID)</text>
<text x="26" y="412" dy=".35em" font-size="12" font-weight="500" fill="#444441" text-anchor="start">Metriche</text>
<text x="124" y="412" dy=".35em" font-size="12" font-weight="400" fill="#444441" text-anchor="start">CMC; DIR e FPIR (open)</text>
<rect x="350" y="20" width="310" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="505.0" y="42.0" dy=".35em" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Re-identificazione</text>
<text x="505" y="84" dy=".35em" font-size="12" font-weight="400" fill="#444441" text-anchor="middle">orizzonte temporale breve</text>
<rect x="380" y="106" width="250" height="54" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="505.0" y="125.44" dy=".35em" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Query</text>
<text x="505.0" y="144.88" dy=".35em" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">persona vista da cam A</text>
<line x1="505" y1="160" x2="505" y2="190" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="380" y="194" width="250" height="54" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="505.0" y="213.44" dy=".35em" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Gallery di apparizioni</text>
<text x="505.0" y="232.88" dy=".35em" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">frame di cam B, C, ...</text>
<line x1="505" y1="248" x2="505" y2="278" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="380" y="282" width="250" height="54" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="505.0" y="301.44" dy=".35em" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Stessa persona o no</text>
<text x="505.0" y="320.88" dy=".35em" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle">senza conoscere il nome</text>
<text x="356" y="364" dy=".35em" font-size="12" font-weight="500" fill="#444441" text-anchor="start">Insieme</text>
<text x="454" y="364" dy=".35em" font-size="12" font-weight="400" fill="#444441" text-anchor="start">tipicamente closed set</text>
<text x="356" y="388" dy=".35em" font-size="12" font-weight="500" fill="#444441" text-anchor="start">Output</text>
<text x="454" y="388" dy=".35em" font-size="12" font-weight="400" fill="#444441" text-anchor="start">corrispondenza tra apparizioni</text>
<text x="356" y="412" dy=".35em" font-size="12" font-weight="500" fill="#444441" text-anchor="start">Metriche</text>
<text x="454" y="412" dy=".35em" font-size="12" font-weight="400" fill="#444441" text-anchor="start">CMC oppure mAP</text>
</svg>