<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640" font-family="Helvetica, Arial, sans-serif">
<rect width="920" height="640" fill="#ffffff"/>
<text x="460.0" y="32.0" text-anchor="middle" font-size="20" font-weight="700" fill="#111">Identificazione open set: i cinque esiti</text>
<text x="460.0" y="54.0" text-anchor="middle" font-size="13" fill="#444">Righe = cosa fa il sistema · colonne = dove si trova davvero la persona (ground truth)</text>
<text x="420.0" y="98.0" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">Persona IN gallery</text>
<text x="420.0" y="118.0" text-anchor="middle" font-size="12.5" fill="#555">p_j ∈ P_G (noto)</text>
<text x="720.0" y="98.0" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">Persona NON in gallery</text>
<text x="720.0" y="118.0" text-anchor="middle" font-size="12.5" fill="#555">p_j ∈ P_N (impostore)</text>
<text x="256.0" y="208.5" text-anchor="end" font-size="14" font-weight="700" fill="#111">Il sistema rifiuta</text>
<text x="256.0" y="226.5" text-anchor="end" font-size="11.5" fill="#555">s* &lt; t</text>
<text x="256.0" y="333.5" text-anchor="end" font-size="14" font-weight="700" fill="#111">Accetta · rank 1 corretto</text>
<text x="256.0" y="351.5" text-anchor="end" font-size="11.5" fill="#555">s* ≥ t  e  id(g_rank1) = id(p_j)</text>
<text x="256.0" y="458.5" text-anchor="end" font-size="14" font-weight="700" fill="#111">Accetta · rank 1 sbagliato</text>
<text x="256.0" y="476.5" text-anchor="end" font-size="11.5" fill="#555">s* ≥ t  e  id(g_rank1) ≠ id(p_j)</text>
<rect x="278.0" y="158.0" width="284.0" height="109.0" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="420.0" y="210.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b45309">C · False Rejection</text>
<text x="420.0" y="231.5" text-anchor="middle" font-size="11.5" fill="#333">noto non riconosciuto</text>
<rect x="578.0" y="158.0" width="284.0" height="109.0" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="720.0" y="210.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#15803d">D · Genuine Reject</text>
<text x="720.0" y="231.5" text-anchor="middle" font-size="11.5" fill="#333">impostore rifiutato: corretto</text>
<rect x="278.0" y="283.0" width="284.0" height="109.0" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="420.0" y="335.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#15803d">A · Correct Detect and Identify</text>
<text x="420.0" y="356.5" text-anchor="middle" font-size="11.5" fill="#333">noto riconosciuto: corretto</text>
<rect x="578.0" y="283.0" width="284.0" height="109.0" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,4"/>
<text x="720.0" y="335.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6b7280">impossibile</text>
<text x="720.0" y="356.5" text-anchor="middle" font-size="11.5" fill="#333">un ignoto non ha identità corretta</text>
<rect x="278.0" y="408.0" width="284.0" height="109.0" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="420.0" y="460.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b45309">B · False Rejection</text>
<text x="420.0" y="481.5" text-anchor="middle" font-size="11.5" fill="#333">noto accettato ma scambiato (misidentification)</text>
<rect x="578.0" y="408.0" width="284.0" height="109.0" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="720.0" y="460.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b91c1c">E · False Alarm</text>
<text x="720.0" y="481.5" text-anchor="middle" font-size="11.5" fill="#333">impostore accettato (False Acceptance)</text>
<text x="40.0" y="560.0" text-anchor="start" font-size="13" font-weight="700" fill="#111">Come entrano nelle metriche</text>
<text x="40.0" y="585.0" text-anchor="start" font-size="13" font-weight="700" fill="#15803d">A</text>
<text x="102.0" y="585.0" text-anchor="start" font-size="12.5" fill="#333">DIR(t,1) = A / |P_G|</text>
<text x="470.0" y="585.0" text-anchor="start" font-size="13" font-weight="700" fill="#b45309">B + C</text>
<text x="532.0" y="585.0" text-anchor="start" font-size="12.5" fill="#333">FNIR(t) = (B + C) / |P_G| = 1 − DIR(t,1)</text>
<text x="40.0" y="609.0" text-anchor="start" font-size="13" font-weight="700" fill="#b91c1c">E</text>
<text x="102.0" y="609.0" text-anchor="start" font-size="12.5" fill="#333">FPIR(t) = E / |P_N|</text>
<text x="470.0" y="609.0" text-anchor="start" font-size="13" font-weight="700" fill="#15803d">D</text>
<text x="532.0" y="609.0" text-anchor="start" font-size="12.5" fill="#333">1 − FPIR(t) = D / |P_N|</text>
</svg>