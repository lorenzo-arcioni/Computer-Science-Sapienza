<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="460.0" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111827" font-weight="700">FAR/FRR e Precision/Recall sulla stessa matrice di confusione</text>
<text x="460.0" y="53" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#4b5563">GA = 70 · FR = 10 · FA = 5 · GR = 15  →  TG = 80 genuini, TI = 20 impostori</text>
<text x="240" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#111" font-weight="700">Prospettiva ML: sui positivi</text>
<text x="175.0" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555" font-weight="700">accettato</text>
<text x="305.0" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555" font-weight="700">rifiutato</text>
<text x="102" y="169.0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555" font-weight="700">genuino</text>
<rect x="110" y="130" width="130" height="70" rx="0" fill="#dcfce7" stroke="#9ca3af" stroke-width="1"/>
<text x="175.0" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#166534" font-weight="700">GA</text>
<text x="175.0" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">70</text>
<rect x="240" y="130" width="130" height="70" rx="0" fill="#ffedd5" stroke="#9ca3af" stroke-width="1"/>
<text x="305.0" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b45309" font-weight="700">FR</text>
<text x="305.0" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">10</text>
<text x="102" y="239.0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555" font-weight="700">impostore</text>
<rect x="110" y="200" width="130" height="70" rx="0" fill="#fee2e2" stroke="#9ca3af" stroke-width="1"/>
<text x="175.0" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b91c1c" font-weight="700">FA</text>
<text x="175.0" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">5</text>
<rect x="240" y="200" width="130" height="70" rx="0" fill="#dcfce7" stroke="#9ca3af" stroke-width="1"/>
<text x="305.0" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#166534" font-weight="700">GR</text>
<text x="305.0" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">15</text>
<rect x="107" y="127" width="266" height="76" fill="none" stroke="#15803d" stroke-width="3.5" stroke-dasharray="8,5"/>
<rect x="107" y="127" width="136" height="146" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-dasharray="none"/>
<text x="690" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#111" font-weight="700">Prospettiva biometrica: per categoria</text>
<text x="625.0" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555" font-weight="700">accettato</text>
<text x="755.0" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555" font-weight="700">rifiutato</text>
<text x="552" y="169.0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555" font-weight="700">genuino</text>
<rect x="560" y="130" width="130" height="70" rx="0" fill="#dcfce7" stroke="#9ca3af" stroke-width="1"/>
<text x="625.0" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#166534" font-weight="700">GA</text>
<text x="625.0" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">70</text>
<rect x="690" y="130" width="130" height="70" rx="0" fill="#ffedd5" stroke="#9ca3af" stroke-width="1"/>
<text x="755.0" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b45309" font-weight="700">FR</text>
<text x="755.0" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">10</text>
<text x="552" y="239.0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555" font-weight="700">impostore</text>
<rect x="560" y="200" width="130" height="70" rx="0" fill="#fee2e2" stroke="#9ca3af" stroke-width="1"/>
<text x="625.0" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b91c1c" font-weight="700">FA</text>
<text x="625.0" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">5</text>
<rect x="690" y="200" width="130" height="70" rx="0" fill="#dcfce7" stroke="#9ca3af" stroke-width="1"/>
<text x="755.0" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#166534" font-weight="700">GR</text>
<text x="755.0" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">15</text>
<rect x="557" y="127" width="266" height="76" fill="none" stroke="#b45309" stroke-width="3.5" stroke-dasharray="none"/>
<rect x="557" y="197" width="266" height="76" fill="none" stroke="#b91c1c" stroke-width="3.5" stroke-dasharray="8,5"/>
<text x="110" y="300" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="700">Precision = GA / (GA + FA)  (colonna blu)</text>
<text x="110" y="320" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222">= 70 / 75 = 0.933</text>
<text x="110" y="346" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#15803d" font-weight="700">Recall = GA / (GA + FR)  (riga viola)</text>
<text x="110" y="366" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222">= 70 / 80 = 0.875</text>
<text x="560" y="300" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#b45309" font-weight="700">FRR = FR / TG  (riga genuini)</text>
<text x="560" y="320" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222">= 10 / 80 = 0.125 = 1 − Recall</text>
<text x="560" y="346" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#b91c1c" font-weight="700">FAR = FA / TI  (riga impostori)</text>
<text x="560" y="366" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#222">= 5 / 20 = 0.250 = FP / (FP + TN)</text>
<rect x="60.0" y="413.0" width="800" height="74" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="460.0" y="437.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827" font-weight="700">Dipendenza dalla composizione: con 10× impostori e lo stesso comportamento (FAR = 0.25) → FA = 50, GA = 70</text>
<text x="460.0" y="454.375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827">Precision scende da 0.933 a 0.583; FAR e FRR restano identici (0.25 e 0.125)</text>
<text x="460.0" y="471.25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827">FAR/FRR descrivono il sistema; la Precision dipende anche da quanti impostori si presentano.</text>
<text x="460.0" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#555">Recall = GAR = 1 − FRR · il complemento di FAR è GRR (specificità). Precision/Recall guardano i positivi, FAR/FRR separano genuini e impostori.</text>
</svg>