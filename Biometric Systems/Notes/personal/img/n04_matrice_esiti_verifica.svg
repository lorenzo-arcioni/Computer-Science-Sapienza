<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="920" height="600" fill="#ffffff"/>
<text x="460.0" y="32.0" text-anchor="middle" font-size="20" font-weight="700" fill="#111">Verifica: i 4 possibili esiti</text>
<text x="460.0" y="54.0" text-anchor="middle" font-size="13" fill="#444">Righe = la rivendicazione è vera o falsa (ground truth) · colonne = decisione del sistema</text>
<text x="432.5" y="96.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Accettato</text>
<text x="432.5" y="112.0" text-anchor="middle" font-size="12" fill="#555">punteggio sopra la soglia</text>
<text x="717.5" y="96.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Rifiutato</text>
<text x="717.5" y="112.0" text-anchor="middle" font-size="12" fill="#555">punteggio sotto la soglia</text>
<text x="276.0" y="173.5" text-anchor="end" font-size="14" font-weight="700" fill="#111">Identità dichiarata VERA</text>
<text x="276.0" y="191.5" text-anchor="end" font-size="12" fill="#555">rivendicazione genuina</text>
<text x="276.0" y="211.5" text-anchor="end" font-size="12.5" font-weight="700" fill="#7c3aed">TG = GA + FR</text>
<text x="276.0" y="308.5" text-anchor="end" font-size="14" font-weight="700" fill="#111">Identità dichiarata FALSA</text>
<text x="276.0" y="326.5" text-anchor="end" font-size="12" fill="#555">rivendicazione impostore</text>
<text x="276.0" y="346.5" text-anchor="end" font-size="12.5" font-weight="700" fill="#7c3aed">TI = FA + GR</text>
<rect x="298.0" y="128.0" width="269.0" height="119.0" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="432.5" y="170.0" text-anchor="middle" font-size="28" font-weight="700" fill="#15803d">GA</text>
<text x="432.5" y="194.0" text-anchor="middle" font-size="11.5" fill="#333">Genuine Acceptance / Genuine Match</text>
<text x="432.5" y="212.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">esito positivo</text>
<rect x="583.0" y="128.0" width="269.0" height="119.0" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="717.5" y="170.0" text-anchor="middle" font-size="28" font-weight="700" fill="#b45309">FR</text>
<text x="717.5" y="194.0" text-anchor="middle" font-size="11.5" fill="#333">False Rejection / False Non Match</text>
<text x="717.5" y="212.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">errore tipo I · utente bloccato</text>
<rect x="298.0" y="263.0" width="269.0" height="119.0" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="432.5" y="305.0" text-anchor="middle" font-size="28" font-weight="700" fill="#b91c1c">FA</text>
<text x="432.5" y="329.0" text-anchor="middle" font-size="11.5" fill="#333">False Acceptance / False Match</text>
<text x="432.5" y="347.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">errore tipo II · il più critico</text>
<rect x="583.0" y="263.0" width="269.0" height="119.0" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="717.5" y="305.0" text-anchor="middle" font-size="28" font-weight="700" fill="#15803d">GR</text>
<text x="717.5" y="329.0" text-anchor="middle" font-size="11.5" fill="#333">Genuine Reject / Genuine Non Match</text>
<text x="717.5" y="347.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">esito positivo</text>
<text x="40.0" y="420.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#111">Come entrano nei tassi (ognuno normalizzato sulla propria riga)</text>
<text x="40.0" y="448.0" text-anchor="start" font-size="13" fill="#15803d">GAR = GA / TG</text>
<text x="380.0" y="448.0" text-anchor="start" font-size="13" font-weight="700" fill="#b45309">FRR = FR / TG = 1 − GAR</text>
<text x="40.0" y="472.0" text-anchor="start" font-size="13" font-weight="700" fill="#b91c1c">FAR = FA / TI</text>
<text x="380.0" y="472.0" text-anchor="start" font-size="13" fill="#15803d">GRR = GR / TI = 1 − FAR</text>
<text x="40.0" y="506.0" text-anchor="start" font-size="12" fill="#555">FA e FR sono in compromesso: alzando la soglia FAR scende e FRR sale.</text>
</svg>