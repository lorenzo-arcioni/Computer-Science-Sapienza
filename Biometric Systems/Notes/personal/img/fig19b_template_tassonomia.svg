<svg xmlns="http://www.w3.org/2000/svg" width="920" height="670" viewBox="0 0 920 670">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="460.0" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111827" font-weight="700">Template updating: due scelte indipendenti</text>
<text x="460.0" y="53" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#4b5563">Come si assegnano le etichette ai nuovi dati · quando si scelgono i template più rappresentativi</text>
<text x="230" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111" font-weight="700">Assegnazione delle etichette</text>
<rect x="30.0" y="121.0" width="400" height="98" rx="9" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
<text x="230" y="149.0625" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827" font-weight="700">Supervised</text>
<text x="230" y="165.9375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827">serve un supervisore che assegna le identità ai nuovi dati</text>
<text x="230" y="182.8125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827">durante l&#x27;esercizio del sistema</text>
<text x="230" y="199.6875" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827">di solito lavora offline</text>
<rect x="30.0" y="241.0" width="400" height="98" rx="9" fill="#ffedd5" stroke="#b45309" stroke-width="1.5"/>
<text x="230" y="269.0625" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827" font-weight="700">Semi-supervised</text>
<text x="230" y="285.9375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827">usa l&#x27;unione di dati etichettati e non etichettati</text>
<text x="230" y="302.8125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827">lavora sia online sia offline</text>
<text x="230" y="319.6875" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827"></text>
<text x="690" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111" font-weight="700">Selezione dei template più rappresentativi</text>
<rect x="490.0" y="121.0" width="400" height="98" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="690" y="149.0625" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827" font-weight="700">Online</text>
<text x="690" y="165.9375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827">la selezione avviene appena il sistema acquisisce</text>
<text x="690" y="182.8125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827">nuovi dati in ingresso</text>
<text x="690" y="199.6875" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827"></text>
<rect x="490.0" y="241.0" width="400" height="98" rx="9" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="690" y="269.0625" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827" font-weight="700">Offline</text>
<text x="690" y="285.9375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827">la selezione avviene dopo aver raccolto una certa quantità</text>
<text x="690" y="302.8125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827">di dati in un certo intervallo di tempo</text>
<text x="690" y="319.6875" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#111827"></text>
