<text x="80" y="545" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#555">Una buona misura abbassa l&#x27;EER scartando poco (curva che scende presto). Se la curva resta piatta, la misura non vede la qualità che conta.</text>
<text x="80" y="563" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#555">Con pochi campioni rimasti (soglia molto alta) l&#x27;EER è stimato su insiemi piccoli e va letto con cautela: serve sempre il tasso di immagini adeguate.</text>
