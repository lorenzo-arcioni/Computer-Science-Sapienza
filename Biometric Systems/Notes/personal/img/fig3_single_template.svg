<text x="590.0" y="150.0" text-anchor="start" font-size="15" font-weight="700" fill="#111">Conteggi (diagonale esclusa)</text>
<text x="590.0" y="182.0" text-anchor="start" font-size="14" font-weight="700" fill="#15803d">GA = 4</text>
<text x="668.0" y="182.0" text-anchor="start" font-size="12.5" fill="#444">genuine accept</text>
<text x="590.0" y="208.0" text-anchor="start" font-size="14" font-weight="700" fill="#b45309">FR = 2</text>
<text x="668.0" y="208.0" text-anchor="start" font-size="12.5" fill="#444">false reject</text>
<text x="590.0" y="234.0" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c">FA = 4</text>
<text x="668.0" y="234.0" text-anchor="start" font-size="12.5" fill="#444">false accept</text>
<text x="590.0" y="260.0" text-anchor="start" font-size="14" font-weight="700" fill="#6b7280">GR = 20</text>
<text x="668.0" y="260.0" text-anchor="start" font-size="12.5" fill="#444">genuine reject</text>
<text x="590.0" y="310.0" text-anchor="start" font-size="13" fill="#222">TG = |G|·(S−1) = 6·1 = 6  (GA+FR = 4+2)</text>
<text x="590.0" y="334.0" text-anchor="start" font-size="13" fill="#222">TI = |G|·(N−1)·S = 6·2·2 = 24  (FA+GR = 4+20)</text>
<text x="590.0" y="378.0" text-anchor="start" font-size="13" fill="#222">GAR = GA/TG = 4/6 = 0.667</text>
<text x="590.0" y="402.0" text-anchor="start" font-size="13" fill="#222">FRR = FR/TG = 2/6 = 0.333</text>
<text x="590.0" y="426.0" text-anchor="start" font-size="13" fill="#222">FAR = FA/TI = 4/24 = 0.167</text>
<text x="590.0" y="450.0" text-anchor="start" font-size="13" fill="#222">GRR = GR/TI = 20/24 = 0.833</text>
<text x="130.0" y="582.0" text-anchor="start" font-size="12" fill="#555">viola = genuina (stesso soggetto) · grigio = impostore · ogni cella è un esperimento</text>
