<text x="570.0" y="150.0" text-anchor="start" font-size="15" font-weight="700" fill="#111">M[i,j] = d(probe_i, gallery_j)</text>
<rect x="570.0" y="175.0" width="34.0" height="26.0" fill="#ede9fe" stroke="#9ca3af" stroke-width="1"/>
<text x="587.0" y="192.3" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">G</text>
<text x="616.0" y="193.0" text-anchor="start" font-size="12.5" fill="#222">cella genuina: label(i) = label(j)</text>
<rect x="570.0" y="211.0" width="34.0" height="26.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="587.0" y="228.3" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">imp</text>
<text x="616.0" y="229.0" text-anchor="start" font-size="12.5" fill="#222">cella impostore: label(i) ≠ label(j)</text>
<rect x="570.0" y="247.0" width="34.0" height="26.0" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
<text x="587.0" y="264.3" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">×</text>
<text x="616.0" y="265.0" text-anchor="start" font-size="12.5" fill="#222">diagonale i = j: stesso campione, esclusa</text>
<text x="570.0" y="310.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#111">Una riga = più esperimenti</text>
<text x="766.0" y="310.0" text-anchor="start" font-size="12" fill="#555">(riga tratteggiata)</text>
<text x="570.0" y="334.0" text-anchor="start" font-size="13" fill="#222">• celle genuine: S − 1 = 1</text>
<text x="570.0" y="356.0" text-anchor="start" font-size="13" fill="#222">• celle impostore: (N − 1)·S = 4</text>
<text x="570.0" y="400.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#111">Totali sulla matrice (diagonale esclusa)</text>
<text x="570.0" y="424.0" text-anchor="start" font-size="13" fill="#222">TG = |G|·(S − 1) = 6·1 = 6</text>
<text x="570.0" y="446.0" text-anchor="start" font-size="13" fill="#222">TI = |G|·(N − 1)·S = 6·2·2 = 24</text>
<text x="570.0" y="488.0" text-anchor="start" font-size="12.5" fill="#555">Gli impostori sono molto più numerosi dei genuini:</text>
<text x="570.0" y="506.0" text-anchor="start" font-size="12.5" fill="#555">il sistema viene «stressato» di più.</text>
