<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="m_455a64" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455a64"/></marker></defs><rect x="0" y="0" width="1000" height="300" fill="#ffffff"/><text x="500.0" y="24.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#1b1b1b" font-weight="bold">Distillation (model compression): teacher → etichette → student</text><rect x="30.0" y="80.0" width="200.0" height="90.0" rx="5" fill="#cfe2ff" stroke="#2b5fb4" stroke-width="1.2"/><text x="130.0" y="106.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="normal">1. Teacher</text><text x="130.0" y="121.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="normal">SOTA pre-training</text><text x="130.0" y="136.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="normal">+ fine-tuning</text><text x="130.0" y="151.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="normal">(massima accuratezza)</text><text x="130.0" y="64.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#455a64" font-weight="normal">50k esempi etichettati</text><line x1="232.0" y1="125.0" x2="290.0" y2="125.0" stroke="#455a64" stroke-width="1.8" marker-end="url(#m_455a64)"/><rect x="292.0" y="80.0" width="200.0" height="90.0" rx="5" fill="#fff3c4" stroke="#a67c00" stroke-width="1.2"/><text x="392.0" y="106.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="normal">2. Etichetta molti</text><text x="392.0" y="121.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="normal">esempi NON etichettati</text><text x="392.0" y="136.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="normal">con il teacher</text><text x="392.0" y="151.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="normal">(es. 8M)</text><line x1="494.0" y1="125.0" x2="552.0" y2="125.0" stroke="#455a64" stroke-width="1.8" marker-end="url(#m_455a64)"/><rect x="554.0" y="80.0" width="200.0" height="90.0" rx="5" fill="#d6f0d4" stroke="#2e7d32" stroke-width="1.2"/><text x="654.0" y="106.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="normal">3. Student</text><text x="654.0" y="121.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="normal">modello molto più piccolo</text><text x="654.0" y="136.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="normal">(es. 50× meno parametri)</text><text x="654.0" y="151.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="normal">imita l'uscita del teacher</text><line x1="756.0" y1="125.0" x2="800.0" y2="125.0" stroke="#455a64" stroke-width="1.8" marker-end="url(#m_455a64)"/><rect x="802.0" y="95.0" width="170.0" height="60.0" rx="5" fill="#ffe0b2" stroke="#e65100" stroke-width="1.2"/><text x="887.0" y="115.1" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#1b1b1b" font-weight="normal">obiettivo dello student:</text><text x="887.0" y="128.8" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#1b1b1b" font-weight="normal">MSE oppure cross-entropy</text><text x="887.0" y="142.6" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#1b1b1b" font-weight="normal">rispetto al teacher</text><text x="500.0" y="230.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#455a64" font-weight="normal">Riferimenti nella slide: Bucila et al. 2006, Hinton et al. 2015, Belagiannis-Farshad-Galasso 2018.</text><text x="500.0" y="252.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#455a64" font-weight="normal">Lo student impara da molti più esempi (etichettati dal teacher) di quelli che avrebbe con le sole etichette vere.</text></svg>