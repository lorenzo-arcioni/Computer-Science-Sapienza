/text><text x="36" y="63" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Ogni filtro produce una mappa di attivazione; K filtri → K canali in uscita</text><polygon points="50,160.0 68,142.0 198,142.0 180,160.0" fill="#93c5fd" stroke="#fff" stroke-width="1.5"/><polygon points="180,160.0 198,142.0 198,272.0 180,290.0" fill="#60a5fa" stroke="#fff" stroke-width="1.5"/><rect x="50" y="160.0" width="130" height="130" rx="0" fill="#bfdbfe" stroke="#fff" stroke-width="1.5" /><text x="124.0" y="324.0" font-size="16" fill="#1e293b" font-weight="800" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">32×32×3</text><text x="124.0" y="346.0" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">entrata</text><polygon points="390,168.0 426,132.0 540,132.0 504,168.0" fill="#86efac" stroke="#fff" stroke-width="1.5"/><polygon points="504,168.0 540,132.0 540,246.0 504,282.0" fill="#4ade80" stroke="#fff" stroke-width="1.5"/><rect x="390" y="168.0" width="114" height="114" rx="0" fill="#bbf7d0" stroke="#fff" stroke-width="1.5" /><text x="465.0" y="316.0" font-size="16" fill="#1e293b" font-weight="800" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">28×28×6</text><text x="465.0" y="338.0" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">32 − 5 + 1 = 28</text><polygon points="730,176.0 790,116.0 888,116.0 828,176.0" fill="#d8b4fe" stroke="#fff" stroke-width="1.5"/><polygon points="828,176.0 888,116.0 888,214.0 828,274.0" fill="#c084fc" stroke="#fff" stroke-width="1.5"/><rect x="730" y="176.0" width="98" height="98" rx="0" fill="#e9d5ff" stroke="#fff" stroke-width="1.5" /><text x="809.0" y="308.0" font-size="16" fill="#1e293b" font-weight="800" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">24×24×10</text><text x="809.0" y="330.0" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">28 − 5 + 1 = 24</text><polygon points="70,175 88,157 124,157 106,175" fill="#fcd34d" stroke="#fff" stroke-width="1.5"/><polygon points="106,175 124,157 124,193 106,211" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/><rect x="70" y="175" width="36" height="36" rx="0" fill="#fde68a" stroke="#fff" stroke-width="1.5" /><text x="100" y="133" font-size="12" fill="#b45309" font-weight="700" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">filtro 5×5×3</text><line x1="215" y1="225" x2="380" y2="225" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round" marker-end="url(#a_blue)"/><text x="297.5" y="203" font-size="13" fill="#6366f1" font-weight="700" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">CONV  6 filtri 5×5×3</text><text x="297.5" y="253" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">ReLU · 456 param.</text><line x1="560" y1="225" x2="720" y2="225" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round" marker-end="url(#a_blue)"/><text x="640.0" y="203" font-size="13" fill="#6366f1" font-weight="700" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">CONV  10 filtri 5×5×6</text><text x="640.0" y="253" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">ReLU · 1 510 param.</text><rect x="210" y="345" width="580" height="62" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/><text x="500" y="372" font-size="16" fill="#1e293b" font-weight="400" text-anchor="middle" font-family="'STIX Two Math', 'Cambria Math', 'Times New Roman', serif" font-style="italic">W_out = (W_in + 2P − F) / S + 1        parametri = C_out (C_in·F·F + 1)</text><text x="500" y="396" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">la profondità dei filtri coincide con i canali dell'input (3, poi 6)</text></svg>