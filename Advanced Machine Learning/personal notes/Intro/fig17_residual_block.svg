<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f5f9"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1e293b"/></marker><marker id="a_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker><marker id="a_green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="a_muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="a_violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker></defs><rect x="1" y="1" width="898" height="388" rx="20" fill="url(#bg)" stroke="#e2e8f0" stroke-width="2"/><rect x="36" y="16" width="38" height="4" rx="2" fill="#6366f1" /><text x="36" y="40" font-size="21" fill="#1e293b" font-weight="700" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Connessione residua (ResNet)</text><text x="36" y="63" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Il gradiente ha sempre una scorciatoia</text><line x1="40" y1="200" x2="130" y2="200" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a_ink)"/><text x="30" y="205" font-size="20" fill="#1e293b" font-weight="400" text-anchor="end" font-family="'STIX Two Math', 'Cambria Math', 'Times New Roman', serif" font-style="italic">x</text><rect x="140" y="170" width="90" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5" filter="url(#sh)"/><text x="185" y="206" font-size="15" fill="#3b82f6" font-weight="700" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">conv</text><rect x="270" y="170" width="90" height="60" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5" filter="url(#sh)"/><text x="315" y="206" font-size="15" fill="#10b981" font-weight="700" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">ReLU</text><rect x="400" y="170" width="90" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5" filter="url(#sh)"/><text x="445" y="206" font-size="15" fill="#3b82f6" font-weight="700" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">conv</text><line x1="230" y1="200" x2="268" y2="200" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a_ink)"/><line x1="360" y1="200" x2="398" y2="200" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a_ink)"/><line x1="490" y1="200" x2="575" y2="200" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a_ink)"/><text x="330" y="144" font-size="18" fill="#6366f1" font-weight="400" text-anchor="middle" font-family="'STIX Two Math', 'Cambria Math', 'Times New Roman', serif" font-style="italic">F(x)</text><path d="M110 200 C 110 80, 600 80, 600 170" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a_amber)"/><text x="355" y="104" font-size="14" fill="#b45309" font-weight="700" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">identity: x</text><circle cx="600" cy="200" r="24" fill="#fff7ed" stroke="#f59e0b" stroke-width="3" /><text x="600" y="210" font-size="28" fill="#f59e0b" font-weight="800" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">+</text><line x1="624" y1="200" x2="690" y2="200" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a_ink)"/><text x="704" y="206" font-size="17" fill="#1e293b" font-weight="400" text-anchor="start" font-family="'STIX Two Math', 'Cambria Math', 'Times New Roman', serif" font-style="italic">y = F(x) + x</text><rect x="120" y="285" width="560" height="80" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/><text x="400" y="318" font-size="19" fill="#1e293b" font-weight="400" text-anchor="middle" font-family="'STIX Two Math', 'Cambria Math', 'Times New Roman', serif" font-style="italic">∂L/∂x = ∂L/∂y · (∂F/∂x + I)</text><text x="400" y="346" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">il termine I è un cammino diretto per il gradiente attraverso centinaia di strati</text></svg>