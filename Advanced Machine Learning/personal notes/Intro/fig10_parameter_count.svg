<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f5f9"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1e293b"/></marker><marker id="a_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker><marker id="a_green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="a_muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="a_violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker></defs><rect x="1" y="1" width="838" height="378" rx="20" fill="url(#bg)" stroke="#e2e8f0" stroke-width="2"/><rect x="36" y="16" width="38" height="4" rx="2" fill="#6366f1" /><text x="36" y="40" font-size="21" fill="#1e293b" font-weight="700" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Località + condivisione dei pesi</text><text x="36" y="63" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Da 10¹² a 10⁴ parametri: quattro ordini di grandezza in meno a ogni passo</text><text x="40" y="132" font-size="15" fill="#1e293b" font-weight="700" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Fully connected</text><text x="40" y="152" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">ogni unità vede tutti i 10⁶ pixel</text><rect x="280" y="110" width="500" height="46" rx="10" fill="#f1f5f9" /><rect x="280" y="110" width="480" height="46" rx="10" fill="#ef4444" /><text x="746" y="141" font-size="16" fill="#fff" font-weight="800" text-anchor="end" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">10¹² parametri</text><text x="40" y="214" font-size="15" fill="#1e293b" font-weight="700" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Localmente connessa</text><text x="40" y="234" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">filtro 10×10 per unità</text><rect x="280" y="192" width="500" height="46" rx="10" fill="#f1f5f9" /><rect x="280" y="192" width="320" height="46" rx="10" fill="#f59e0b" /><text x="586" y="223" font-size="16" fill="#fff" font-weight="800" text-anchor="end" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">10⁸ parametri</text><text x="40" y="296" font-size="15" fill="#1e293b" font-weight="700" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Convoluzionale</text><text x="40" y="316" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">100 filtri 10×10, pesi condivisi</text><rect x="280" y="274" width="500" height="46" rx="10" fill="#f1f5f9" /><rect x="280" y="274" width="160" height="46" rx="10" fill="#10b981" /><text x="426" y="305" font-size="16" fill="#fff" font-weight="800" text-anchor="end" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">10⁴ parametri</text><text x="530" y="355" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">scala logaritmica (lunghezza ∝ esponente)</text><text x="530" y="90" font-size="13" fill="#64748b" font-weight="600" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">immagine 1000×1000, 10⁶ unità nascoste</text></svg>