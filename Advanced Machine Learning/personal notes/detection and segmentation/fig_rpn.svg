<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><text x="480.0" y="26.0" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">Region Proposal Network: ancore + due teste convoluzionali</text><text x="30.0" y="55.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="bold">K = 9 ancore per posizione (3 scale x 3 rapporti)</text><rect x="165.1" y="140.2" width="49.8" height="99.6" rx="0" fill="none" stroke="#2b6cb0" stroke-width="1.6" opacity="1"/><rect x="154.8" y="154.8" width="70.4" height="70.4" rx="0" fill="none" stroke="#2b6cb0" stroke-width="1.6" opacity="1" stroke-dasharray="5,3"/><rect x="140.2" y="165.1" width="99.6" height="49.8" rx="0" fill="none" stroke="#2b6cb0" stroke-width="1.6" opacity="1" stroke-dasharray="2,3"/><rect x="140.2" y="90.4" width="99.6" height="199.1" rx="0" fill="none" stroke="#2f855a" stroke-width="1.6" opacity="1"/><rect x="119.6" y="119.6" width="140.8" height="140.8" rx="0" fill="none" stroke="#2f855a" stroke-width="1.6" opacity="1" stroke-dasharray="5,3"/><rect x="90.4" y="140.2" width="199.1" height="99.6" rx="0" fill="none" stroke="#2f855a" stroke-width="1.6" opacity="1" stroke-dasharray="2,3"/><rect x="90.4" y="-9.1" width="199.1" height="398.2" rx="0" fill="none" stroke="#c53030" stroke-width="1.6" opacity="1"/><rect x="49.2" y="49.2" width="281.6" height="281.6" rx="0" fill="none" stroke="#c53030" stroke-width="1.6" opacity="1" stroke-dasharray="5,3"/><rect x="-9.1" y="90.4" width="398.2" height="199.1" rx="0" fill="none" stroke="#c53030" stroke-width="1.6" opacity="1" stroke-dasharray="2,3"/><circle cx="190.0" cy="190.0" r="3" fill="#000" stroke="#000" stroke-width="1.2"/><text x="30.0" y="380.0" font-size="10.5" fill="#718096" text-anchor="start">blu/verde/rosso = scala 128/256/512; continuo / tratteggio / punteggiato = rapporto 1:2, 1:1, 2:1</text><text x="430.0" y="55.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="bold">Teste sulla feature map (es. 512 x 15 x 20)</text><rect x="430.0" y="75.0" width="130.0" height="50.0" rx="3" fill="#bee3f8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="495.0" y="96.1" font-size="11" fill="#222" text-anchor="middle">feature map</text><text x="495.0" y="111.5" font-size="11" fill="#222" text-anchor="middle">512 x 15 x 20</text><rect x="600.0" y="75.0" width="90.0" height="50.0" rx="3" fill="#feebc8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="645.0" y="103.8" font-size="11" fill="#222" text-anchor="middle">conv 3x3</text><line x1="560.0" y1="100.0" x2="600.0" y2="100.0" stroke="#333" stroke-width="1.6"/><polygon points="600.0,100.0 591.7,103.5 591.7,96.5" fill="#333"/><line x1="690.0" y1="100.0" x2="730.0" y2="70.0" stroke="#333" stroke-width="1.6"/><polygon points="730.0,70.0 725.5,77.8 721.3,72.2" fill="#333"/><line x1="690.0" y1="100.0" x2="730.0" y2="135.0" stroke="#333" stroke-width="1.6"/><polygon points="730.0,135.0 721.5,132.2 726.1,126.9" fill="#333"/><rect x="730.0" y="45.0" width="200.0" height="50.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="830.0" y="66.1" font-size="11" fill="#222" text-anchor="middle">objectness: K x 15 x 20</text><text x="830.0" y="81.5" font-size="11" fill="#222" text-anchor="middle">= 9 x 15 x 20</text><rect x="730.0" y="110.0" width="200.0" height="50.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="830.0" y="131.2" font-size="11" fill="#222" text-anchor="middle">trasformazioni: 4K x 15 x 20</text><text x="830.0" y="146.6" font-size="11" fill="#222" text-anchor="middle">= 36 x 15 x 20</text><rect x="430.0" y="190.0" width="500.0" height="215.0" rx="3" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.2" opacity="1"/><text x="442.0" y="212.0" font-size="11.2" fill="#222" text-anchor="start">Ancore totali = K x 15 x 20 = 2700. Si ordinano per objectness, NMS, si tengono le ~300 migliori.</text><text x="442.0" y="228.2" font-size="11.2" fill="#222" text-anchor="start">Parametrizzazione del box (ancora (xa,ya,wa,ha) -&gt; box (x,y,w,h)):</text><text x="442.0" y="244.5" font-size="11.2" fill="#222" text-anchor="start">  tx=(x-xa)/wa, ty=(y-ya)/ha, tw=log(w/wa), th=log(h/ha)</text><text x="442.0" y="260.7" font-size="11.2" fill="#222" text-anchor="start">Esempio: ancora (100,100,128,128), t=(0.1,-0.2,0.3,-0.1):</text><text x="442.0" y="277.0" font-size="11.2" fill="#222" text-anchor="start">  x = 100+0.1*128 = 112.8,  y = 100-0.2*128 = 74.4,</text><text x="442.0" y="293.2" font-size="11.2" fill="#222" text-anchor="start">  w = 128*e^0.3 = 172.8,  h = 128*e^-0.1 = 115.8.</text><text x="442.0" y="309.4" font-size="11.2" fill="#222" text-anchor="start">Le 4 loss di Faster R-CNN: objectness (RPN), box (RPN), classe, box (finale).</text></svg>