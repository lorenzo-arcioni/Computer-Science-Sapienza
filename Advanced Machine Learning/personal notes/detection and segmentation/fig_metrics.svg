<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><text x="480.0" y="26.0" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">Metriche per segmentazione: l'accuratezza di pixel inganna, l'IoU no</text><text x="30.0" y="55.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="bold">Matrice di confusione (100 pixel; righe = verita, colonne = predetto)</text><rect x="110.0" y="90.0" width="56.0" height="56.0" rx="0" fill="#c6f6d5" stroke="#444" stroke-width="1" opacity="1"/><text x="138.0" y="122.9" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">70</text><rect x="166.0" y="90.0" width="56.0" height="56.0" rx="0" fill="#fed7d7" stroke="#444" stroke-width="1" opacity="1"/><text x="194.0" y="122.9" font-size="14" fill="#222" text-anchor="middle">3</text><rect x="222.0" y="90.0" width="56.0" height="56.0" rx="0" fill="#fed7d7" stroke="#444" stroke-width="1" opacity="1"/><text x="250.0" y="122.9" font-size="14" fill="#222" text-anchor="middle">2</text><rect x="110.0" y="146.0" width="56.0" height="56.0" rx="0" fill="#fed7d7" stroke="#444" stroke-width="1" opacity="1"/><text x="138.0" y="178.9" font-size="14" fill="#222" text-anchor="middle">4</text><rect x="166.0" y="146.0" width="56.0" height="56.0" rx="0" fill="#c6f6d5" stroke="#444" stroke-width="1" opacity="1"/><text x="194.0" y="178.9" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">12</text><rect x="222.0" y="146.0" width="56.0" height="56.0" rx="0" fill="#fed7d7" stroke="#444" stroke-width="1" opacity="1"/><text x="250.0" y="178.9" font-size="14" fill="#222" text-anchor="middle">1</text><rect x="110.0" y="202.0" width="56.0" height="56.0" rx="0" fill="#fed7d7" stroke="#444" stroke-width="1" opacity="1"/><text x="138.0" y="234.9" font-size="14" fill="#222" text-anchor="middle">2</text><rect x="166.0" y="202.0" width="56.0" height="56.0" rx="0" fill="#fed7d7" stroke="#444" stroke-width="1" opacity="1"/><text x="194.0" y="234.9" font-size="14" fill="#222" text-anchor="middle">1</text><rect x="222.0" y="202.0" width="56.0" height="56.0" rx="0" fill="#c6f6d5" stroke="#444" stroke-width="1" opacity="1"/><text x="250.0" y="234.9" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">5</text><text x="138.0" y="82.0" font-size="11" fill="#222" text-anchor="middle">sfondo</text><text x="100.0" y="122.0" font-size="11" fill="#222" text-anchor="end">sfondo</text><text x="194.0" y="82.0" font-size="11" fill="#222" text-anchor="middle">gatto</text><text x="100.0" y="178.0" font-size="11" fill="#222" text-anchor="end">gatto</text><text x="250.0" y="82.0" font-size="11" fill="#222" text-anchor="middle">cane</text><text x="100.0" y="234.0" font-size="11" fill="#222" text-anchor="end">cane</text><text x="30.0" y="280.0" font-size="12" fill="#222" text-anchor="start">Per la classe c:   IoU_c = TP / (TP + FP + FN)   (Jaccard)</text><text x="30.0" y="300.0" font-size="11.5" fill="#222" text-anchor="start">accuratezza di pixel = sum_c TP_c / N ;   accuratezza per classe = media_c TP_c / (TP_c + FN_c)</text><rect x="430.0" y="60.0" width="500.0" height="190.0" rx="3" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.2" opacity="1"/><text x="442.0" y="82.0" font-size="12" fill="#222" text-anchor="start">Pixel corretti: 70+12+5 = 87 =&gt; accuratezza di pixel = 0.87</text><text x="442.0" y="99.4" font-size="12" fill="#222" text-anchor="start">IoU sfondo = 70/(70+6+5)  = 0.864</text><text x="442.0" y="116.8" font-size="12" fill="#222" text-anchor="start">IoU gatto   = 12/(12+4+5)  = 0.571</text><text x="442.0" y="134.2" font-size="12" fill="#222" text-anchor="start">IoU cane    = 5/(5+3+3)    = 0.455</text><text x="442.0" y="151.6" font-size="12" fill="#222" text-anchor="start">mIoU = media = 0.630</text><text x="442.0" y="169.0" font-size="12" fill="#222" text-anchor="start">Acc. per classe: 0.933, 0.706, 0.625 -&gt; media 0.755</text><rect x="30.0" y="330.0" width="900.0" height="85.0" rx="3" fill="#fed7d7" stroke="#c53030" stroke-width="1.2" opacity="1"/><text x="42.0" y="352.0" font-size="12" fill="#222" text-anchor="start">Predittore banale "tutto sfondo": accuratezza di pixel = 75/100 = 0.75, ma IoU = (0.75, 0, 0) e mIoU = 0.25.</text><text x="42.0" y="369.4" font-size="12" fill="#222" text-anchor="start">Per questo, con classi molto sbilanciate (heavy tails), si usa la IoU (media sulle classi e sulle immagini) e non l'accuratezza di pixel.</text></svg>