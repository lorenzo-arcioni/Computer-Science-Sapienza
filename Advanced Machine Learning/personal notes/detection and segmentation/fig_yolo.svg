 stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="110.0" y="220.0" width="40.0" height="40.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="150.0" y="220.0" width="40.0" height="40.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="190.0" y="220.0" width="40.0" height="40.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="230.0" y="220.0" width="40.0" height="40.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="270.0" y="220.0" width="40.0" height="40.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="30.0" y="260.0" width="40.0" height="40.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="70.0" y="260.0" width="40.0" height="40.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="110.0" y="260.0" width="40.0" height="40.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="150.0" y="260.0" width="40.0" height="40.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="190.0" y="260.0" width="40.0" height="40.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="230.0" y="260.0" width="40.0" height="40.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="270.0" y="260.0" width="40.0" height="40.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="30.0" y="300.0" width="40.0" height="40.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="70.0" y="300.0" width="40.0" height="40.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="110.0" y="300.0" width="40.0" height="40.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="150.0" y="300.0" width="40.0" height="40.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="190.0" y="300.0" width="40.0" height="40.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="230.0" y="300.0" width="40.0" height="40.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="270.0" y="300.0" width="40.0" height="40.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" opacity="1"/><rect x="140.0" y="130.0" width="130.0" height="120.0" rx="0" fill="none" stroke="#c53030" stroke-width="2.5" opacity="1"/><circle cx="200.0" cy="190.0" r="4" fill="#c53030" stroke="#c53030" stroke-width="1.2"/><rect x="160.0" y="150.0" width="80.0" height="80.0" rx="0" fill="none" stroke="#2b6cb0" stroke-width="1.4" opacity="1" stroke-dasharray="5,3"/><rect x="145.0" y="155.0" width="110.0" height="70.0" rx="0" fill="none" stroke="#2f855a" stroke-width="1.4" opacity="1" stroke-dasharray="5,3"/><rect x="165.0" y="130.0" width="70.0" height="120.0" rx="0" fill="none" stroke="#dd6b20" stroke-width="1.4" opacity="1" stroke-dasharray="5,3"/><text x="30.0" y="360.0" font-size="11" fill="#718096" text-anchor="start">rosso = oggetto vero; punto = suo centro, che cade nella cella gialla (riga 3, colonna 4);</text><text x="30.0" y="376.0" font-size="11" fill="#718096" text-anchor="start">tratteggiati = B=3 box base di quella cella, da cui si regredisce (dx,dy,dw,dh,conf).</text><text x="400.0" y="60.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold">Vettore di una cella (35 numeri)</text><rect x="400.0" y="80.0" width="55.0" height="46.0" rx="3" fill="#bee3f8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="427.5" y="99.3" font-size="10.5" fill="#222" text-anchor="middle">box 1</text><text x="427.5" y="114.0" font-size="10.5" fill="#222" text-anchor="middle">5</text><text x="427.0" y="142.0" font-size="8" fill="#718096" text-anchor="middle">dx dy dw dh conf</text><rect x="460.0" y="80.0" width="55.0" height="46.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="487.5" y="99.3" font-size="10.5" fill="#222" text-anchor="middle">box 2</text><text x="487.5" y="114.0" font-size="10.5" fill="#222" text-anchor="middle">5</text><text x="487.0" y="142.0" font-size="8" fill="#718096" text-anchor="middle">dx dy dw dh conf</text><rect x="520.0" y="80.0" width="55.0" height="46.0" rx="3" fill="#feebc8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="547.5" y="99.3" font-size="10.5" fill="#222" text-anchor="middle">box 3</text><text x="547.5" y="114.0" font-size="10.5" fill="#222" text-anchor="middle">5</text><text x="547.0" y="142.0" font-size="8" fill="#718096" text-anchor="middle">dx dy dw dh conf</text><rect x="580.0" y="80.0" width="180.0" height="46.0" rx="3" fill="#fed7d7" stroke="#333" stroke-width="1.2" opacity="1"/><text x="670.0" y="99.3" font-size="10.5" fill="#222" text-anchor="middle">C = 20 punteggi di classe</text><text x="670.0" y="114.0" font-size="10.5" fill="#222" text-anchor="middle">(incluso sfondo come classe)</text><text x="400.0" y="168.0" font-size="12" fill="#222" text-anchor="start" font-weight="bold">Uscita: 7 x 7 x (5B + C) = 7 x 7 x 35</text><rect x="400.0" y="190.0" width="550.0" height="215.0" rx="3" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.2" opacity="1"/><text x="412.0" y="212.0" font-size="11.2" fill="#222" text-anchor="start">Numeri totali = 49 x 35 = 1715. Box candidati = 49 x 3 = 147.</text><text x="412.0" y="228.2" font-size="11.2" fill="#222" text-anchor="start">Centro (170,130) px, cella 40 px: colonna 4, riga 3; offset nella cella = (0.25, 0.25).</text><text x="412.0" y="244.5" font-size="11.2" fill="#222" text-anchor="start">Una cella e "responsabile" dell'oggetto se ne contiene il centro.</text><text x="412.0" y="260.7" font-size="11.2" fill="#222" text-anchor="start">Si assomiglia alla RPN (ancore + regressione) ma e specifica per categoria:</text><text x="412.0" y="277.0" font-size="11.2" fill="#222" text-anchor="start">classifica e localizza in un solo passaggio, senza secondo stadio.</text><text x="412.0" y="293.2" font-size="11.2" fill="#222" text-anchor="start">Poi NMS per eliminare i duplicati. Perdita: somma di errori quadratici su</text><text x="412.0" y="309.4" font-size="11.2" fill="#222" text-anchor="start">coordinate, confidenza e classi (YOLOv1); RetinaNet usa la focal loss.</text><text x="412.0" y="325.7" font-size="11.2" fill="#222" text-anchor="start">YOLOv1 originale: B=2, C=20 =&gt; 7x7x30 = 1470 numeri (le slide usano B=3).</text></svg>