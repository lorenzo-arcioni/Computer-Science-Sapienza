="150.0" stroke="#6b46c1" stroke-width="2.5"/><text x="358.0" y="154.0" font-size="11" fill="#222" text-anchor="start">gamma = 5</text><rect x="520.0" y="70.0" width="360.0" height="290.0" rx="3" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.2" opacity="1"/><text x="532.0" y="92.0" font-size="11.5" fill="#222" text-anchor="start">Detector a singolo stadio: ~10^4-10^5 candidati per immagine,</text><text x="532.0" y="108.7" font-size="11.5" fill="#222" text-anchor="start">quasi tutti sfondo facile =&gt; la loss e dominata dai facili.</text><text x="532.0" y="125.3" font-size="11.5" fill="#222" text-anchor="start"></text><text x="532.0" y="142.0" font-size="11.5" fill="#222" text-anchor="start">Con gamma = 2:</text><text x="532.0" y="158.7" font-size="11.5" fill="#222" text-anchor="start">  esempio facile p_t = 0.9: (0.1)^2 * 0.105 = 0.00105</text><text x="532.0" y="175.4" font-size="11.5" fill="#222" text-anchor="start">  esempio difficile p_t = 0.1: (0.9)^2 * 2.303 = 1.865</text><text x="532.0" y="192.1" font-size="11.5" fill="#222" text-anchor="start">  rapporto difficile/facile = 1770 (con CE: 21.9)</text><text x="532.0" y="208.7" font-size="11.5" fill="#222" text-anchor="start"></text><text x="532.0" y="225.4" font-size="11.5" fill="#222" text-anchor="start">Il fattore (1 - p_t)^gamma "spegne" gli esempi gia</text><text x="532.0" y="242.1" font-size="11.5" fill="#222" text-anchor="start">classificati bene e concentra il gradiente sui difficili.</text><text x="532.0" y="258.8" font-size="11.5" fill="#222" text-anchor="start">(Di solito si aggiunge un peso alpha_t di bilanciamento.)</text></svg>