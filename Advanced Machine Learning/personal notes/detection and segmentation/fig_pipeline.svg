<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><text x="490.0" y="26.0" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">Da R-CNN a Faster R-CNN: dove si condivide il calcolo</text><text x="20.0" y="90.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold">R-CNN</text><rect x="130.0" y="60.0" width="135.0" height="55.0" rx="3" fill="#edf2f7" stroke="#333" stroke-width="1.2" opacity="1"/><text x="197.5" y="91.0" font-size="10" fill="#222" text-anchor="middle">immagine</text><line x1="265.0" y1="87.0" x2="277.0" y2="87.0" stroke="#333" stroke-width="1.6"/><polygon points="277.0,87.0 268.7,90.5 268.7,83.5" fill="#333"/><rect x="277.0" y="60.0" width="135.0" height="55.0" rx="3" fill="#feebc8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="344.5" y="84.0" font-size="10" fill="#222" text-anchor="middle">~2000 proposte (Sel</text><text x="344.5" y="98.0" font-size="10" fill="#222" text-anchor="middle">ective Search)</text><line x1="412.0" y1="87.0" x2="424.0" y2="87.0" stroke="#333" stroke-width="1.6"/><polygon points="424.0,87.0 415.7,90.5 415.7,83.5" fill="#333"/><rect x="424.0" y="60.0" width="135.0" height="55.0" rx="3" fill="#feebc8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="491.5" y="84.0" font-size="10" fill="#222" text-anchor="middle">crop + warp 2000 vo</text><text x="491.5" y="98.0" font-size="10" fill="#222" text-anchor="middle">lte</text><line x1="559.0" y1="87.0" x2="571.0" y2="87.0" stroke="#333" stroke-width="1.6"/><polygon points="571.0,87.0 562.7,90.5 562.7,83.5" fill="#333"/><rect x="571.0" y="60.0" width="135.0" height="55.0" rx="3" fill="#fed7d7" stroke="#333" stroke-width="1.2" opacity="1"/><text x="638.5" y="91.0" font-size="10" fill="#222" text-anchor="middle">CNN x 2000</text><line x1="706.0" y1="87.0" x2="718.0" y2="87.0" stroke="#333" stroke-width="1.6"/><polygon points="718.0,87.0 709.7,90.5 709.7,83.5" fill="#333"/><rect x="718.0" y="60.0" width="135.0" height="55.0" rx="3" fill="#bee3f8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="785.5" y="84.0" font-size="10" fill="#222" text-anchor="middle">SVM + regressione b</text><text x="785.5" y="98.0" font-size="10" fill="#222" text-anchor="middle">ox</text><text x="130.0" y="135.0" font-size="11" fill="#718096" text-anchor="start">costo del backbone: 2000 passaggi</text><text x="20.0" y="195.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold">Fast R-CNN</text><rect x="130.0" y="165.0" width="135.0" height="55.0" rx="3" fill="#edf2f7" stroke="#333" stroke-width="1.2" opacity="1"/><text x="197.5" y="196.0" font-size="10" fill="#222" text-anchor="middle">immagine</text><line x1="265.0" y1="192.0" x2="277.0" y2="192.0" stroke="#333" stroke-width="1.6"/><polygon points="277.0,192.0 268.7,195.5 268.7,188.5" fill="#333"/><rect x="277.0" y="165.0" width="135.0" height="55.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="344.5" y="189.0" font-size="10" fill="#222" text-anchor="middle">CNN x 1 (tutta l'im</text><text x="344.5" y="203.0" font-size="10" fill="#222" text-anchor="middle">magine)</text><line x1="412.0" y1="192.0" x2="424.0" y2="192.0" stroke="#333" stroke-width="1.6"/><polygon points="424.0,192.0 415.7,195.5 415.7,188.5" fill="#333"/><rect x="424.0" y="165.0" width="135.0" height="55.0" rx="3" fill="#feebc8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="491.5" y="189.0" font-size="10" fill="#222" text-anchor="middle">proposte (Selective</text><text x="491.5" y="203.0" font-size="10" fill="#222" text-anchor="middle"> Search)</text><line x1="559.0" y1="192.0" x2="571.0" y2="192.0" stroke="#333" stroke-width="1.6"/><polygon points="571.0,192.0 562.7,195.5 562.7,188.5" fill="#333"/><rect x="571.0" y="165.0" width="135.0" height="55.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="638.5" y="196.0" font-size="10" fill="#222" text-anchor="middle">RoI Pool su feature</text><line x1="706.0" y1="192.0" x2="718.0" y2="192.0" stroke="#333" stroke-width="1.6"/><polygon points="718.0,192.0 709.7,195.5 709.7,188.5" fill="#333"/><rect x="718.0" y="165.0" width="135.0" height="55.0" rx="3" fill="#bee3f8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="785.5" y="196.0" font-size="10" fill="#222" text-anchor="middle">FC: classe + box</text><text x="130.0" y="240.0" font-size="11" fill="#718096" text-anchor="start">costo del backbone: 1 passaggio (+ proposte)</text><text x="20.0" y="300.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold">Faster R-CNN</text><rect x="130.0" y="270.0" width="135.0" height="55.0" rx="3" fill="#edf2f7" stroke="#333" stroke-width="1.2" opacity="1"/><text x="197.5" y="301.0" font-size="10" fill="#222" text-anchor="middle">immagine</text><line x1="265.0" y1="297.0" x2="277.0" y2="297.0" stroke="#333" stroke-width="1.6"/><polygon points="277.0,297.0 268.7,300.5 268.7,293.5" fill="#333"/><rect x="277.0" y="270.0" width="135.0" height="55.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="344.5" y="301.0" font-size="10" fill="#222" text-anchor="middle">CNN x 1 (backbone)</text><line x1="412.0" y1="297.0" x2="424.0" y2="297.0" stroke="#333" stroke-width="1.6"/><polygon points="424.0,297.0 415.7,300.5 415.7,293.5" fill="#333"/><rect x="424.0" y="270.0" width="135.0" height="55.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="491.5" y="294.0" font-size="10" fill="#222" text-anchor="middle">RPN (proposte dalla</text><text x="491.5" y="308.0" font-size="10" fill="#222" text-anchor="middle"> CNN)</text><line x1="559.0" y1="297.0" x2="571.0" y2="297.0" stroke="#333" stroke-width="1.6"/><polygon points="571.0,297.0 562.7,300.5 562.7,293.5" fill="#333"/><rect x="571.0" y="270.0" width="135.0" height="55.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="638.5" y="301.0" font-size="10" fill="#222" text-anchor="middle">RoI Pool/Align</text><line x1="706.0" y1="297.0" x2="718.0" y2="297.0" stroke="#333" stroke-width="1.6"/><polygon points="718.0,297.0 709.7,300.5 709.7,293.5" fill="#333"/><rect x="718.0" y="270.0" width="135.0" height="55.0" rx="3" fill="#bee3f8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="785.5" y="301.0" font-size="10" fill="#222" text-anchor="middle">classe + box</text><text x="130.0" y="345.0" font-size="11" fill="#718096" text-anchor="start">costo del backbone: 1 passaggio, tutto nella rete</text><rect x="20.0" y="380.0" width="940.0" height="70.0" rx="3" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.2" opacity="1"/><text x="32.0" y="400.0" font-size="11" fill="#222" text-anchor="start">Idea chiave di Fast R-CNN: scambiare convoluzione e ritaglio ("process image before cropping") =&gt; backbone una sola volta per immagine.</text><text x="32.0" y="415.9" font-size="11" fill="#222" text-anchor="start">Idea chiave di Faster R-CNN: eliminare anche le proposte esterne (CPU) con la RPN; il collo di bottiglia diventava il tempo delle proposte.</text><text x="32.0" y="431.9" font-size="11" fill="#222" text-anchor="start">Ordini di grandezza del tempo per immagine riportati in letteratura: ~49 s, ~2.3 s, ~0.2 s (valori indicativi, non nel testo delle slide).</text></svg>