eight="42.0" rx="0" fill="#feebc8" stroke="#444" stroke-width="1" opacity="1"/><text x="219.0" y="221.6" font-size="13" fill="#222" text-anchor="middle">5</text><rect x="240.0" y="196.0" width="42.0" height="42.0" rx="0" fill="#feebc8" stroke="#444" stroke-width="1" opacity="1"/><text x="261.0" y="221.6" font-size="13" fill="#222" text-anchor="middle">6</text><rect x="282.0" y="196.0" width="42.0" height="42.0" rx="0" fill="#edf2f7" stroke="#444" stroke-width="1" opacity="1"/><text x="303.0" y="221.6" font-size="13" fill="#222" text-anchor="middle">3</text><rect x="324.0" y="196.0" width="42.0" height="42.0" rx="0" fill="#edf2f7" stroke="#444" stroke-width="1" opacity="1"/><text x="345.0" y="221.6" font-size="13" fill="#222" text-anchor="middle">1</text><rect x="30.0" y="238.0" width="42.0" height="42.0" rx="0" fill="#edf2f7" stroke="#444" stroke-width="1" opacity="1"/><text x="51.0" y="263.6" font-size="13" fill="#222" text-anchor="middle">6</text><rect x="72.0" y="238.0" width="42.0" height="42.0" rx="0" fill="#feebc8" stroke="#444" stroke-width="1" opacity="1"/><text x="93.0" y="263.6" font-size="13" fill="#222" text-anchor="middle">3</text><rect x="114.0" y="238.0" width="42.0" height="42.0" rx="0" fill="#feebc8" stroke="#444" stroke-width="1" opacity="1"/><text x="135.0" y="263.6" font-size="13" fill="#222" text-anchor="middle">4</text><rect x="156.0" y="238.0" width="42.0" height="42.0" rx="0" fill="#feebc8" stroke="#444" stroke-width="1" opacity="1"/><text x="177.0" y="263.6" font-size="13" fill="#222" text-anchor="middle">5</text><rect x="198.0" y="238.0" width="42.0" height="42.0" rx="0" fill="#feebc8" stroke="#444" stroke-width="1" opacity="1"/><text x="219.0" y="263.6" font-size="13" fill="#222" text-anchor="middle">9</text><rect x="240.0" y="238.0" width="42.0" height="42.0" rx="0" fill="#feebc8" stroke="#444" stroke-width="1" opacity="1"/><text x="261.0" y="263.6" font-size="13" fill="#222" text-anchor="middle">2</text><rect x="282.0" y="238.0" width="42.0" height="42.0" rx="0" fill="#edf2f7" stroke="#444" stroke-width="1" opacity="1"/><text x="303.0" y="263.6" font-size="13" fill="#222" text-anchor="middle">4</text><rect x="324.0" y="238.0" width="42.0" height="42.0" rx="0" fill="#edf2f7" stroke="#444" stroke-width="1" opacity="1"/><text x="345.0" y="263.6" font-size="13" fill="#222" text-anchor="middle">6</text><rect x="30.0" y="280.0" width="42.0" height="42.0" rx="0" fill="#edf2f7" stroke="#444" stroke-width="1" opacity="1"/><text x="51.0" y="305.6" font-size="13" fill="#222" text-anchor="middle">2</text><rect x="72.0" y="280.0" width="42.0" height="42.0" rx="0" fill="#edf2f7" stroke="#444" stroke-width="1" opacity="1"/><text x="93.0" y="305.6" font-size="13" fill="#222" text-anchor="middle">5</text><rect x="114.0" y="280.0" width="42.0" height="42.0" rx="0" fill="#edf2f7" stroke="#444" stroke-width="1" opacity="1"/><text x="135.0" y="305.6" font-size="13" fill="#222" text-anchor="middle">1</text><rect x="156.0" y="280.0" width="42.0" height="42.0" rx="0" fill="#edf2f7" stroke="#444" stroke-width="1" opacity="1"/><text x="177.0" y="305.6" font-size="13" fill="#222" text-anchor="middle">3</text><rect x="198.0" y="280.0" width="42.0" height="42.0" rx="0" fill="#edf2f7" stroke="#444" stroke-width="1" opacity="1"/><text x="219.0" y="305.6" font-size="13" fill="#222" text-anchor="middle">4</text><rect x="240.0" y="280.0" width="42.0" height="42.0" rx="0" fill="#edf2f7" stroke="#444" stroke-width="1" opacity="1"/><text x="261.0" y="305.6" font-size="13" fill="#222" text-anchor="middle">7</text><rect x="282.0" y="280.0" width="42.0" height="42.0" rx="0" fill="#edf2f7" stroke="#444" stroke-width="1" opacity="1"/><text x="303.0" y="305.6" font-size="13" fill="#222" text-anchor="middle">8</text><rect x="324.0" y="280.0" width="42.0" height="42.0" rx="0" fill="#edf2f7" stroke="#444" stroke-width="1" opacity="1"/><text x="345.0" y="305.6" font-size="13" fill="#222" text-anchor="middle">2</text><rect x="84.6" y="103.6" width="184.8" height="159.6" rx="0" fill="none" stroke="#2b6cb0" stroke-width="3" opacity="1"/><rect x="72.0" y="70.0" width="210.0" height="210.0" rx="0" fill="none" stroke="#c53030" stroke-width="2" opacity="1" stroke-dasharray="6,4"/><text x="30.0" y="56.0" font-size="12" fill="#222" text-anchor="start" font-weight="bold">Mappa di feature 6x8 (un canale)</text><text x="30.0" y="344.0" font-size="11" fill="#718096" text-anchor="start">blu: proposta reale (1.3, 0.8)-(5.7, 4.6)   rosso tratteggiato: dopo lo snapping (colonne 1-5, righe 0-4)</text><text x="500.0" y="70.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold">RoI Pool</text><text x="500.0" y="90.0" font-size="11" fill="#718096" text-anchor="start">snap + griglia 2x2 + max</text><rect x="500.0" y="105.0" width="54.0" height="54.0" rx="0" fill="#fed7d7" stroke="#444" stroke-width="1" opacity="1"/><text x="527.0" y="137.2" font-size="15" fill="#222" text-anchor="middle">9</text><rect x="554.0" y="105.0" width="54.0" height="54.0" rx="0" fill="#fed7d7" stroke="#444" stroke-width="1" opacity="1"/><text x="581.0" y="137.2" font-size="15" fill="#222" text-anchor="middle">7</text><rect x="500.0" y="159.0" width="54.0" height="54.0" rx="0" fill="#fed7d7" stroke="#444" stroke-width="1" opacity="1"/><text x="527.0" y="191.2" font-size="15" fill="#222" text-anchor="middle">8</text><rect x="554.0" y="159.0" width="54.0" height="54.0" rx="0" fill="#fed7d7" stroke="#444" stroke-width="1" opacity="1"/><text x="581.0" y="191.2" font-size="15" fill="#222" text-anchor="middle">9</text><text x="680.0" y="70.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold">RoI Align</text><text x="680.0" y="90.0" font-size="11" fill="#718096" text-anchor="start">4 campioni bilineari per cella, media</text><rect x="680.0" y="105.0" width="54.0" height="54.0" rx="0" fill="#c6f6d5" stroke="#444" stroke-width="1" opacity="1"/><text x="707.0" y="136.6" font-size="13" fill="#222" text-anchor="middle">5.42</text><rect x="734.0" y="105.0" width="54.0" height="54.0" rx="0" fill="#c6f6d5" stroke="#444" stroke-width="1" opacity="1"/><text x="761.0" y="136.6" font-size="13" fill="#222" text-anchor="middle">4.65</text><rect x="680.0" y="159.0" width="54.0" height="54.0" rx="0" fill="#c6f6d5" stroke="#444" stroke-width="1" opacity="1"/><text x="707.0" y="190.6" font-size="13" fill="#222" text-anchor="middle">5.30</text><rect x="734.0" y="159.0" width="54.0" height="54.0" rx="0" fill="#c6f6d5" stroke="#444" stroke-width="1" opacity="1"/><text x="761.0" y="190.6" font-size="13" fill="#222" text-anchor="middle">5.62</text><rect x="500.0" y="235.0" width="450.0" height="200.0" rx="3" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.2" opacity="1"/><text x="512.0" y="257.0" font-size="11.5" fill="#222" text-anchor="start">Bilineare: f(x,y) = (1-dx)(1-dy) f11 + dx(1-dy) f21 + (1-dx) dy f12 + dx dy f22</text><text x="512.0" y="273.7" font-size="11.5" fill="#222" text-anchor="start">(f_ij = feature dei 4 vicini, dx,dy = distanza frazionaria).</text><text x="512.0" y="290.4" font-size="11.5" fill="#222" text-anchor="start">RoI Pool arrotonda le coordinate a celle intere: la regione</text><text x="512.0" y="307.0" font-size="11.5" fill="#222" text-anchor="start">ritagliata e leggermente spostata e di taglia diversa da quella vera</text><text x="512.0" y="323.7" font-size="11.5" fill="#222" text-anchor="start">(0.3 celle di errore su ogni lato = ~5 pixel con stride 16),</text><text x="512.0" y="340.4" font-size="11.5" fill="#222" text-anchor="start">e il max e un'operazione discreta. RoI Align non arrotonda mai:</text><text x="512.0" y="357.1" font-size="11.5" fill="#222" text-anchor="start">e differenziabile rispetto ai bordi e mantiene l'allineamento</text><text x="512.0" y="373.7" font-size="11.5" fill="#222" text-anchor="start">(essenziale per le maschere di Mask R-CNN).</text></svg>