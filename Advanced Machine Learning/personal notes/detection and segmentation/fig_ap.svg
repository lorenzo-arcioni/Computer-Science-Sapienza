l="#222" text-anchor="start">0.60</text><rect x="425.0" y="188.0" width="290.0" height="20.0" rx="0" fill="#fed7d7" stroke="#cbd5e0" stroke-width="0.5" opacity="1"/><text x="430.0" y="203.0" font-size="11" fill="#222" text-anchor="start">5</text><text x="500.0" y="203.0" font-size="11" fill="#222" text-anchor="start">FP</text><text x="570.0" y="203.0" font-size="11" fill="#222" text-anchor="start">0.600</text><text x="640.0" y="203.0" font-size="11" fill="#222" text-anchor="start">0.60</text><rect x="425.0" y="210.0" width="290.0" height="20.0" rx="0" fill="#fed7d7" stroke="#cbd5e0" stroke-width="0.5" opacity="1"/><text x="430.0" y="225.0" font-size="11" fill="#222" text-anchor="start">6</text><text x="500.0" y="225.0" font-size="11" fill="#222" text-anchor="start">FP</text><text x="570.0" y="225.0" font-size="11" fill="#222" text-anchor="start">0.500</text><text x="640.0" y="225.0" font-size="11" fill="#222" text-anchor="start">0.60</text><rect x="425.0" y="232.0" width="290.0" height="20.0" rx="0" fill="#c6f6d5" stroke="#cbd5e0" stroke-width="0.5" opacity="1"/><text x="430.0" y="247.0" font-size="11" fill="#222" text-anchor="start">7</text><text x="500.0" y="247.0" font-size="11" fill="#222" text-anchor="start">TP</text><text x="570.0" y="247.0" font-size="11" fill="#222" text-anchor="start">0.571</text><text x="640.0" y="247.0" font-size="11" fill="#222" text-anchor="start">0.80</text><rect x="425.0" y="254.0" width="290.0" height="20.0" rx="0" fill="#fed7d7" stroke="#cbd5e0" stroke-width="0.5" opacity="1"/><text x="430.0" y="269.0" font-size="11" fill="#222" text-anchor="start">8</text><text x="500.0" y="269.0" font-size="11" fill="#222" text-anchor="start">FP</text><text x="570.0" y="269.0" font-size="11" fill="#222" text-anchor="start">0.500</text><text x="640.0" y="269.0" font-size="11" fill="#222" text-anchor="start">0.80</text><rect x="430.0" y="310.0" width="510.0" height="120.0" rx="3" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.2" opacity="1"/><text x="442.0" y="330.0" font-size="11" fill="#222" text-anchor="start">Una detezione e TP se IoU &gt;= soglia (es. 0.5) con un oggetto non ancora abbinato e classe giusta; altrimenti FP.</text><text x="442.0" y="345.9" font-size="11" fill="#222" text-anchor="start">precisione = TP/(TP+FP), richiamo = TP/(# oggetti veri).  AP = area sotto la curva P-R interpolata</text><text x="442.0" y="361.9" font-size="11" fill="#222" text-anchor="start">(precisione = massimo a destra): qui AP = 0.664.  mAP = media di AP sulle classi.</text><text x="442.0" y="377.9" font-size="11" fill="#222" text-anchor="start">COCO: AP mediata anche su soglie IoU 0.50, 0.55, ..., 0.95 (premia la localizzazione precisa).</text></svg>