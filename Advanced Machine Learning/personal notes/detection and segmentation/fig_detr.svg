<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><text x="480.0" y="26.0" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">DETR: insieme di box predetto + abbinamento bipartito con i box veri</text><text x="30.0" y="55.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="bold">Matrice dei costi  C[i,j] = -p_i(c_j) + 5 ||b_i - g_j||_1</text><rect x="150.0" y="95.0" width="70.0" height="70.0" rx="0" fill="#c6f6d5" stroke="#444" stroke-width="1" opacity="1"/><text x="185.0" y="134.6" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">-0.80</text><rect x="220.0" y="95.0" width="70.0" height="70.0" rx="0" fill="#fff" stroke="#444" stroke-width="1" opacity="1"/><text x="255.0" y="134.6" font-size="13" fill="#222" text-anchor="middle">3.40</text><rect x="150.0" y="165.0" width="70.0" height="70.0" rx="0" fill="#fff" stroke="#444" stroke-width="1" opacity="1"/><text x="185.0" y="204.6" font-size="13" fill="#222" text-anchor="middle">3.20</text><rect x="220.0" y="165.0" width="70.0" height="70.0" rx="0" fill="#c6f6d5" stroke="#444" stroke-width="1" opacity="1"/><text x="255.0" y="204.6" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">-0.60</text><rect x="150.0" y="235.0" width="70.0" height="70.0" rx="0" fill="#fff" stroke="#444" stroke-width="1" opacity="1"/><text x="185.0" y="274.6" font-size="13" fill="#222" text-anchor="middle">2.90</text><rect x="220.0" y="235.0" width="70.0" height="70.0" rx="0" fill="#fff" stroke="#444" stroke-width="1" opacity="1"/><text x="255.0" y="274.6" font-size="13" fill="#222" text-anchor="middle">2.40</text><rect x="150.0" y="305.0" width="70.0" height="70.0" rx="0" fill="#fff" stroke="#444" stroke-width="1" opacity="1"/><text x="185.0" y="344.6" font-size="13" fill="#222" text-anchor="middle">-0.00</text><rect x="220.0" y="305.0" width="70.0" height="70.0" rx="0" fill="#fff" stroke="#444" stroke-width="1" opacity="1"/><text x="255.0" y="344.6" font-size="13" fill="#222" text-anchor="middle">3.00</text><text x="185.0" y="87.0" font-size="10" fill="#222" text-anchor="middle">GT 1: cane</text><text x="255.0" y="87.0" font-size="10" fill="#222" text-anchor="middle">GT 2: gatto</text><text x="140.0" y="135.0" font-size="11" fill="#222" text-anchor="end">query 1</text><text x="140.0" y="205.0" font-size="11" fill="#222" text-anchor="end">query 2</text><text x="140.0" y="275.0" font-size="11" fill="#222" text-anchor="end">query 3</text><text x="140.0" y="345.0" font-size="11" fill="#222" text-anchor="end">query 4</text><text x="30.0" y="395.0" font-size="12" fill="#222" text-anchor="start">Assegnamento ottimo (verde): query 1 -&gt; cane, query 2 -&gt; gatto; costo totale -1.40.</text><rect x="450.0" y="70.0" width="490.0" height="330.0" rx="3" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.2" opacity="1"/><text x="462.0" y="92.0" font-size="11.2" fill="#222" text-anchor="start">N_q query (qui 4) producono ciascuna (classe, box) in parallelo (decoder del</text><text x="462.0" y="108.2" font-size="11.2" fill="#222" text-anchor="start">Transformer, query apprese), senza ancore e senza NMS.</text><text x="462.0" y="124.5" font-size="11.2" fill="#222" text-anchor="start"></text><text x="462.0" y="140.7" font-size="11.2" fill="#222" text-anchor="start">Abbinamento: sigma* = argmin_sigma sum_j C[sigma(j), j]  (algoritmo ungherese;</text><text x="462.0" y="157.0" font-size="11.2" fill="#222" text-anchor="start">qui si enumerano le 4*3 = 12 permutazioni).</text><text x="462.0" y="173.2" font-size="11.2" fill="#222" text-anchor="start"></text><text x="462.0" y="189.4" font-size="11.2" fill="#222" text-anchor="start">Loss (Hungarian loss) sulle coppie abbinate:  -log p_sigma(j)(c_j) + lambda_L1 ||b - g||_1</text><text x="462.0" y="205.7" font-size="11.2" fill="#222" text-anchor="start">   + lambda_giou L_GIoU(b, g).</text><text x="462.0" y="221.9" font-size="11.2" fill="#222" text-anchor="start">Le query NON abbinate (query 3 e 4) devono predire "nessun oggetto" (classe vuota),</text><text x="462.0" y="238.2" font-size="11.2" fill="#222" text-anchor="start">tipicamente con peso ridotto perche sono la maggioranza.</text><text x="462.0" y="254.4" font-size="11.2" fill="#222" text-anchor="start"></text><text x="462.0" y="270.6" font-size="11.2" fill="#222" text-anchor="start">Query 4 e un duplicato di query 1 (stesso cane): proprio perche l'abbinamento e</text><text x="462.0" y="286.9" font-size="11.2" fill="#222" text-anchor="start">uno-a-uno, il duplicato viene penalizzato =&gt; niente NMS.</text></svg>