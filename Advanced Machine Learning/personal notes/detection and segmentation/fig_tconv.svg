<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><text x="480.0" y="26.0" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">Convoluzione trasposta: copie del filtro pesate dall'input, sommate dove si sovrappongono</text><text x="20.0" y="55.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold">Esempio 1D (stride 2, k=3)</text><text x="20.0" y="85.0" font-size="12" fill="#222" text-anchor="start">input (a,b) = (1,2)</text><text x="20.0" y="105.0" font-size="12" fill="#222" text-anchor="start">filtro (x,y,z) = (1,2,3)</text><rect x="30.0" y="125.0" width="38.0" height="32.0" rx="3" fill="#bee3f8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="49.0" y="146.0" font-size="12" fill="#222" text-anchor="middle">1</text><rect x="68.0" y="125.0" width="38.0" height="32.0" rx="3" fill="#bee3f8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="87.0" y="146.0" font-size="12" fill="#222" text-anchor="middle">2</text><rect x="106.0" y="125.0" width="38.0" height="32.0" rx="3" fill="#bee3f8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="125.0" y="146.0" font-size="12" fill="#222" text-anchor="middle">3</text><text x="230.0" y="146.0" font-size="11" fill="#718096" text-anchor="start">a*(x,y,z)</text><rect x="106.0" y="165.0" width="38.0" height="32.0" rx="3" fill="#feebc8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="125.0" y="186.0" font-size="12" fill="#222" text-anchor="middle">2</text><rect x="144.0" y="165.0" width="38.0" height="32.0" rx="3" fill="#feebc8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="163.0" y="186.0" font-size="12" fill="#222" text-anchor="middle">4</text><rect x="182.0" y="165.0" width="38.0" height="32.0" rx="3" fill="#feebc8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="201.0" y="186.0" font-size="12" fill="#222" text-anchor="middle">6</text><text x="230.0" y="186.0" font-size="11" fill="#718096" text-anchor="start">b*(x,y,z)</text><rect x="30.0" y="215.0" width="38.0" height="32.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="49.0" y="236.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">1</text><rect x="68.0" y="215.0" width="38.0" height="32.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="87.0" y="236.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">2</text><rect x="106.0" y="215.0" width="38.0" height="32.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="125.0" y="236.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">5</text><rect x="144.0" y="215.0" width="38.0" height="32.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="163.0" y="236.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">4</text><rect x="182.0" y="215.0" width="38.0" height="32.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="201.0" y="236.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">6</text><text x="30.0" y="270.0" font-size="12" fill="#222" text-anchor="start">somma: (ax, ay, az+bx, by, bz) = (1, 2, 5, 4, 6)</text><text x="30.0" y="290.0" font-size="11" fill="#718096" text-anchor="start">lunghezza (n-1)s + k = 5; per ottenere 2n = 4 si taglia 1 elemento</text><text x="500.0" y="55.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold">Perche compaiono artefatti a scacchiera</text><text x="500.0" y="78.0" font-size="11.5" fill="#222" text-anchor="start">Quante volte ogni posizione di uscita riceve un contributo (n=5, s=2):</text><text x="500.0" y="112.0" font-size="12" fill="#222" text-anchor="start" font-weight="bold">k=3</text><rect x="540.0" y="95.0" width="32.0" height="26.0" rx="0" fill="#c6f6d5" stroke="#333" stroke-width="1" opacity="1"/><text x="556.0" y="113.0" font-size="12" fill="#222" text-anchor="middle">1</text><rect x="572.0" y="95.0" width="32.0" height="26.0" rx="0" fill="#c6f6d5" stroke="#333" stroke-width="1" opacity="1"/><text x="588.0" y="113.0" font-size="12" fill="#222" text-anchor="middle">1</text><rect x="604.0" y="95.0" width="32.0" height="26.0" rx="0" fill="#feebc8" stroke="#333" stroke-width="1" opacity="1"/><text x="620.0" y="113.0" font-size="12" fill="#222" text-anchor="middle">2</text><rect x="636.0" y="95.0" width="32.0" height="26.0" rx="0" fill="#c6f6d5" stroke="#333" stroke-width="1" opacity="1"/><text x="652.0" y="113.0" font-size="12" fill="#222" text-anchor="middle">1</text><rect x="668.0" y="95.0" width="32.0" height="26.0" rx="0" fill="#feebc8" stroke="#333" stroke-width="1" opacity="1"/><text x="684.0" y="113.0" font-size="12" fill="#222" text-anchor="middle">2</text><rect x="700.0" y="95.0" width="32.0" height="26.0" rx="0" fill="#c6f6d5" stroke="#333" stroke-width="1" opacity="1"/><text x="716.0" y="113.0" font-size="12" fill="#222" text-anchor="middle">1</text><rect x="732.0" y="95.0" width="32.0" height="26.0" rx="0" fill="#feebc8" stroke="#333" stroke-width="1" opacity="1"/><text x="748.0" y="113.0" font-size="12" fill="#222" text-anchor="middle">2</text><rect x="764.0" y="95.0" width="32.0" height="26.0" rx="0" fill="#c6f6d5" stroke="#333" stroke-width="1" opacity="1"/><text x="780.0" y="113.0" font-size="12" fill="#222" text-anchor="middle">1</text><rect x="796.0" y="95.0" width="32.0" height="26.0" rx="0" fill="#feebc8" stroke="#333" stroke-width="1" opacity="1"/><text x="812.0" y="113.0" font-size="12" fill="#222" text-anchor="middle">2</text><rect x="828.0" y="95.0" width="32.0" height="26.0" rx="0" fill="#c6f6d5" stroke="#333" stroke-width="1" opacity="1"/><text x="844.0" y="113.0" font-size="12" fill="#222" text-anchor="middle">1</text><rect x="860.0" y="95.0" width="32.0" height="26.0" rx="0" fill="#c6f6d5" stroke="#333" stroke-width="1" opacity="1"/><text x="876.0" y="113.0" font-size="12" fill="#222" text-anchor="middle">1</text><text x="500.0" y="182.0" font-size="12" fill="#222" text-anchor="start" font-weight="bold">k=4</text><rect x="540.0" y="165.0" width="32.0" height="26.0" rx="0" fill="#c6f6d5" stroke="#333" stroke-width="1" opacity="1"/><text x="556.0" y="183.0" font-size="12" fill="#222" text-anchor="middle">1</text><rect x="572.0" y="165.0" width="32.0" height="26.0" rx="0" fill="#c6f6d5" stroke="#333" stroke-width="1" opacity="1"/><text x="588.0" y="183.0" font-size="12" fill="#222" text-anchor="middle">1</text><rect x="604.0" y="165.0" width="32.0" height="26.0" rx="0" fill="#feebc8" stroke="#333" stroke-width="1" opacity="1"/><text x="620.0" y="183.0" font-size="12" fill="#222" text-anchor="middle">2</text><rect x="636.0" y="165.0" width="32.0" height="26.0" rx="0" fill="#feebc8" stroke="#333" stroke-width="1" opacity="1"/><text x="652.0" y="183.0" font-size="12" fill="#222" text-anchor="middle">2</text><rect x="668.0" y="165.0" width="32.0" height="26.0" rx="0" fill="#feebc8" stroke="#333" stroke-width="1" opacity="1"/><text x="684.0" y="183.0" font-size="12" fill="#222" text-anchor="middle">2</text><rect x="700.0" y="165.0" width="32.0" height="26.0" rx="0" fill="#feebc8" stroke="#333" stroke-width="1" opacity="1"/><text x="716.0" y="183.0" font-size="12" fill="#222" text-anchor="middle">2</text><rect x="732.0" y="165.0" width="32.0" height="26.0" rx="0" fill="#feebc8" stroke="#333" stroke-width="1" opacity="1"/><text x="748.0" y="183.0" font-size="12" fill="#222" text-anchor="middle">2</text><rect x="764.0" y="165.0" width="32.0" height="26.0" rx="0" fill="#feebc8" stroke="#333" stroke-width="1" opacity="1"/><text x="780.0" y="183.0" font-size="12" fill="#222" text-anchor="middle">2</text><rect x="796.0" y="165.0" width="32.0" height="26.0" rx="0" fill="#feebc8" stroke="#333" stroke-width="1" opacity="1"/><text x="812.0" y="183.0" font-size="12" fill="#222" text-anchor="middle">2</text><rect x="828.0" y="165.0" width="32.0" height="26.0" rx="0" fill="#feebc8" stroke="#333" stroke-width="1" opacity="1"/><text x="844.0" y="183.0" font-size="12" fill="#222" text-anchor="middle">2</text><rect x="860.0" y="165.0" width="32.0" height="26.0" rx="0" fill="#c6f6d5" stroke="#333" stroke-width="1" opacity="1"/><text x="876.0" y="183.0" font-size="12" fill="#222" text-anchor="middle">1</text><rect x="892.0" y="165.0" width="32.0" height="26.0" rx="0" fill="#c6f6d5" stroke="#333" stroke-width="1" opacity="1"/><text x="908.0" y="183.0" font-size="12" fill="#222" text-anchor="middle">1</text><text x="500.0" y="245.0" font-size="11.5" fill="#222" text-anchor="start">k=3, s=2: la copertura alterna 1,2,1,2,... =&gt; uscita non uniforme</text><text x="500.0" y="261.7" font-size="11.5" fill="#222" text-anchor="start">(artefatto a scacchiera, "checkerboard").</text><text x="500.0" y="278.4" font-size="11.5" fill="#222" text-anchor="start">k=4, s=2 (k multiplo di s): copertura 2 uniforme all'interno.</text><rect x="20.0" y="320.0" width="920.0" height="85.0" rx="3" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.2" opacity="1"/><text x="32.0" y="342.0" font-size="11.5" fill="#222" text-anchor="start">Dimensioni:  convoluzione  n_out = floor((n + 2p - k)/s) + 1  ;  trasposta  n_out = (n - 1) s - 2p + k + output_padding.</text><text x="32.0" y="358.7" font-size="11.5" fill="#222" text-anchor="start">Esempio delle slide: ingresso 2x2, k=3, s=2, p=1  =&gt;  (2-1)*2 - 2 + 3 = 3; con output_padding=1 si ottiene 4x4 (= "tagliare" un pixel).</text><text x="32.0" y="375.4" font-size="11.5" fill="#222" text-anchor="start">Nome: "stride" = rapporto tra spostamento in uscita e in ingresso (all'opposto della convoluzione normale).</text></svg>