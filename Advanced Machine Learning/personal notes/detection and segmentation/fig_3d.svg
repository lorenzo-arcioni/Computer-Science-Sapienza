<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><text x="490.0" y="26.0" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">Oltre il 2D: da un raggio a una scatola 3D, e rappresentazioni di forme 3D</text><text x="30.0" y="55.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="bold">Modello a foro stenopeico: un punto 2D e un raggio 3D</text><circle cx="60.0" cy="200.0" r="5" fill="#000" stroke="#000" stroke-width="1.2"/><text x="60.0" y="225.0" font-size="11" fill="#222" text-anchor="middle">camera</text><line x1="260.0" y1="100.0" x2="260.0" y2="300.0" stroke="#718096" stroke-width="3"/><text x="260.0" y="92.0" font-size="11" fill="#222" text-anchor="middle">piano immagine</text><line x1="60.0" y1="200.0" x2="440.0" y2="120.0" stroke="#718096" stroke-width="1.2" stroke-dasharray="4,3"/><polygon points="440.0,120.0 432.6,125.1 431.2,118.3" fill="#718096"/><circle cx="260.0" cy="168.0" r="5" fill="#c53030" stroke="#c53030" stroke-width="1.2"/><text x="272.0" y="160.0" font-size="11" fill="#c53030" text-anchor="start">pixel (u,v)</text><circle cx="150.0" cy="186.0" r="6" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1.2"/><circle cx="350.0" cy="138.0" r="6" fill="#2f855a" stroke="#2f855a" stroke-width="1.2"/><circle cx="430.0" cy="122.0" r="6" fill="#dd6b20" stroke="#dd6b20" stroke-width="1.2"/><text x="150.0" y="214.0" font-size="10" fill="#2b6cb0" text-anchor="middle">stesso pixel,</text><text x="150.0" y="227.0" font-size="10" fill="#2b6cb0" text-anchor="middle">profondita diverse</text><text x="30.0" y="290.0" font-size="11.5" fill="#222" text-anchor="start">u = f X / Z + c_x ,   v = f Y / Z + c_y   (da 3D a 2D si perde Z)</text><text x="30.0" y="310.0" font-size="11.5" fill="#222" text-anchor="start">Da una sola immagine (monoculare) la profondita e ambigua: si regredisce</text><text x="30.0" y="328.0" font-size="11.5" fill="#222" text-anchor="start">box 3D = (x,y,z,w,h,l,theta) con un prior (es. Faster R-CNN + testa 3D).</text><text x="520.0" y="55.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="bold">Rappresentazioni di forme 3D (esempio numerico)</text><rect x="520.0" y="75.0" width="150.0" height="55.0" rx="3" fill="#bee3f8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="595.0" y="98.6" font-size="11" fill="#222" text-anchor="middle">Nuvola di punti</text><text x="595.0" y="114.0" font-size="11" fill="#222" text-anchor="middle">V x 3 float</text><text x="685.0" y="107.0" font-size="11.5" fill="#222" text-anchor="start">2048 x 3 = 6144 numeri</text><rect x="520.0" y="145.0" width="150.0" height="55.0" rx="3" fill="#feebc8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="595.0" y="168.7" font-size="11" fill="#222" text-anchor="middle">Voxel</text><text x="595.0" y="184.1" font-size="11" fill="#222" text-anchor="middle">D x D x D binario</text><text x="685.0" y="177.0" font-size="11.5" fill="#222" text-anchor="start">32^3 = 32 768;  128^3 = 2 097 152</text><rect x="520.0" y="215.0" width="150.0" height="55.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="595.0" y="238.7" font-size="11" fill="#222" text-anchor="middle">Mesh</text><text x="595.0" y="254.1" font-size="11" fill="#222" text-anchor="middle">V x 3 float + F x 3 int</text><text x="685.0" y="247.0" font-size="11.5" fill="#222" text-anchor="start">V=2562: 7686 + F=5120: 15360 numeri</text><rect x="520.0" y="295.0" width="440.0" height="115.0" rx="3" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.2" opacity="1"/><text x="532.0" y="315.0" font-size="11" fill="#222" text-anchor="start">Per confrontare due nuvole di punti A, B si usa la distanza di Chamfer:</text><text x="532.0" y="330.9" font-size="11" fill="#222" text-anchor="start">  d_CD(A,B) = (1/|A|) sum_a min_b ||a-b||^2 + (1/|B|) sum_b min_a ||a-b||^2.</text><text x="532.0" y="346.9" font-size="11" fill="#222" text-anchor="start">Mesh: F ~ 2V (formula di Eulero), quindi 3V + 3F ~ 9V numeri.</text><text x="532.0" y="362.9" font-size="11" fill="#222" text-anchor="start">Mesh R-CNN: Mask R-CNN + voxel grossolani + raffinamento della mesh.</text></svg>