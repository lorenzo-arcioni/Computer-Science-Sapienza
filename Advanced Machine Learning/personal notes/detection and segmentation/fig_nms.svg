<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><text x="480.0" y="26.0" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">IoU e Non-Maximum Suppression</text><rect x="30.0" y="50.0" width="260.0" height="220.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1" opacity="1"/><text x="30.0" y="44.0" font-size="12" fill="#222" text-anchor="start" font-weight="bold">Tutte le predizioni (classe: cane)</text><rect x="60.0" y="70.0" width="80.0" height="80.0" rx="0" fill="none" stroke="#2b6cb0" stroke-width="2.2" opacity="1"/><text x="64.0" y="84.0" font-size="10" fill="#2b6cb0" text-anchor="start" font-weight="bold">A 0.95</text><rect x="70.0" y="75.0" width="80.0" height="80.0" rx="0" fill="none" stroke="#c53030" stroke-width="2.2" opacity="1"/><text x="74.0" y="89.0" font-size="10" fill="#c53030" text-anchor="start" font-weight="bold">B 0.90</text><rect x="65.0" y="90.0" width="70.0" height="70.0" rx="0" fill="none" stroke="#2f855a" stroke-width="2.2" opacity="1"/><text x="69.0" y="104.0" font-size="10" fill="#2f855a" text-anchor="start" font-weight="bold">C 0.60</text><rect x="190.0" y="80.0" width="70.0" height="70.0" rx="0" fill="none" stroke="#dd6b20" stroke-width="2.2" opacity="1"/><text x="194.0" y="94.0" font-size="10" fill="#dd6b20" text-anchor="start" font-weight="bold">D 0.85</text><rect x="195.0" y="85.0" width="70.0" height="73.0" rx="0" fill="none" stroke="#6b46c1" stroke-width="2.2" opacity="1"/><text x="199.0" y="99.0" font-size="10" fill="#6b46c1" text-anchor="start" font-weight="bold">E 0.55</text><rect x="360.0" y="50.0" width="260.0" height="220.0" rx="0" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1" opacity="1"/><text x="360.0" y="44.0" font-size="12" fill="#222" text-anchor="start" font-weight="bold">Dopo NMS (soglia 0.5)</text><rect x="390.0" y="70.0" width="80.0" height="80.0" rx="0" fill="none" stroke="#2b6cb0" stroke-width="2.2" opacity="1"/><text x="394.0" y="84.0" font-size="10" fill="#2b6cb0" text-anchor="start" font-weight="bold">A 0.95</text><rect x="520.0" y="80.0" width="70.0" height="70.0" rx="0" fill="none" stroke="#dd6b20" stroke-width="2.2" opacity="1"/><text x="524.0" y="94.0" font-size="10" fill="#dd6b20" text-anchor="start" font-weight="bold">D 0.85</text><text x="690.0" y="60.0" font-size="12.5" fill="#222" text-anchor="start" font-weight="bold">IoU = area(A n B) / area(A u B)</text><text x="690.0" y="82.0" font-size="11.5" fill="#222" text-anchor="start">A=(20,40,100,120), B=(30,45,110,125)</text><text x="690.0" y="98.7" font-size="11.5" fill="#222" text-anchor="start">intersezione = 5250, unione = 7550</text><text x="690.0" y="115.3" font-size="11.5" fill="#222" text-anchor="start">IoU(A,B) = 5250/7550 = 0.695</text><rect x="690.0" y="150.0" width="44.0" height="44.0" rx="0" fill="#fff" stroke="#444" stroke-width="1" opacity="1"/><text x="712.0" y="175.7" font-size="10.5" fill="#222" text-anchor="middle">1.00</text><rect x="734.0" y="150.0" width="44.0" height="44.0" rx="0" fill="#fed7d7" stroke="#444" stroke-width="1" opacity="1"/><text x="756.0" y="175.7" font-size="10.5" fill="#222" text-anchor="middle">0.70</text><rect x="778.0" y="150.0" width="44.0" height="44.0" rx="0" fill="#fed7d7" stroke="#444" stroke-width="1" opacity="1"/><text x="800.0" y="175.7" font-size="10.5" fill="#222" text-anchor="middle">0.59</text><rect x="822.0" y="150.0" width="44.0" height="44.0" rx="0" fill="#fff" stroke="#444" stroke-width="1" opacity="1"/><text x="844.0" y="175.7" font-size="10.5" fill="#222" text-anchor="middle">0.00</text><rect x="866.0" y="150.0" width="44.0" height="44.0" rx="0" fill="#fff" stroke="#444" stroke-width="1" opacity="1"/><text x="888.0" y="175.7" font-size="10.5" fill="#222" text-anchor="middle">0.00</text><rect x="690.0" y="194.0" width="44.0" height="44.0" rx="0" fill="#fed7d7" stroke="#444" stroke-width="1" opacity="1"/><