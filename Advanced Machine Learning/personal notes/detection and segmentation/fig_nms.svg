ill="#222" text-anchor="middle">A</text><text x="682.0" y="176.0" font-size="11" fill="#222" text-anchor="end">A</text><text x="756.0" y="144.0" font-size="11" fill="#222" text-anchor="middle">B</text><text x="682.0" y="220.0" font-size="11" fill="#222" text-anchor="end">B</text><text x="800.0" y="144.0" font-size="11" fill="#222" text-anchor="middle">C</text><text x="682.0" y="264.0" font-size="11" fill="#222" text-anchor="end">C</text><text x="844.0" y="144.0" font-size="11" fill="#222" text-anchor="middle">D</text><text x="682.0" y="308.0" font-size="11" fill="#222" text-anchor="end">D</text><text x="888.0" y="144.0" font-size="11" fill="#222" text-anchor="middle">E</text><text x="682.0" y="352.0" font-size="11" fill="#222" text-anchor="end">E</text><rect x="30.0" y="290.0" width="640.0" height="165.0" rx="3" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.2" opacity="1"/><text x="42.0" y="312.0" font-size="11.5" fill="#222" text-anchor="start">Algoritmo (greedy): ordina per punteggio -&gt; prendi il migliore -&gt; elimina i box con IoU &gt; 0.5 con esso -&gt; ripeti.</text><text x="42.0" y="328.7" font-size="11.5" fill="#222" text-anchor="start">Ordine: A(0.95), B(0.90), D(0.85), C(0.60), E(0.55).</text><text x="42.0" y="345.4" font-size="11.5" fill="#222" text-anchor="start">1) tengo A; IoU(A,B) = 0.70 &gt; 0.5 e IoU(A,C) = 0.59 &gt; 0.5: B e C soppressi.</text><text x="42.0" y="362.0" font-size="11.5" fill="#222" text-anchor="start">2) tengo D; IoU(D,E) = 0.73 &gt; 0.5: E soppresso.</text><text x="42.0" y="378.7" font-size="11.5" fill="#222" text-anchor="start">Risultato: ['A', 'D'].</text><text x="42.0" y="395.4" font-size="11.5" fill="#222" text-anchor="start">Limite: due oggetti veri molto sovrapposti (folla) possono essere soppressi per errore.</text></svg>