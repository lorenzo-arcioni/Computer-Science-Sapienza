<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><text x="480.0" y="26.0" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">Encoder-decoder (FCN) e U-Net: le skip connection restituiscono il dettaglio spaziale</text><rect x="40.0" y="60.0" width="70.0" height="120.0" rx="3" fill="#bee3f8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="75.0" y="116.3" font-size="10.5" fill="#222" text-anchor="middle">64</text><text x="75.0" y="131.0" font-size="10.5" fill="#222" text-anchor="middle">H x W</text><rect x="810.0" y="60.0" width="70.0" height="120.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="845.0" y="116.3" font-size="10.5" fill="#222" text-anchor="middle">64+64</text><text x="845.0" y="131.0" font-size="10.5" fill="#222" text-anchor="middle">-&gt;64</text><line x1="110.0" y1="120.0" x2="810.0" y2="120.0" stroke="#dd6b20" stroke-width="1.6" stroke-dasharray="6,4"/><polygon points="810.0,120.0 801.7,123.5 801.7,116.5" fill="#dd6b20"/><text x="460.0" y="114.0" font-size="10" fill="#dd6b20" text-anchor="middle">concatenazione (skip)</text><line x1="75.0" y1="180.0" x2="185.0" y2="145.0" stroke="#2b6cb0" stroke-width="1.6"/><polygon points="185.0,145.0 178.2,150.9 176.0,144.2" fill="#2b6cb0"/><line x1="735.0" y1="153.0" x2="845.0" y2="180.0" stroke="#2f855a" stroke-width="1.6"/><polygon points="845.0,180.0 836.1,181.4 837.8,174.6" fill="#2f855a"/><rect x="150.0" y="115.0" width="70.0" height="100.0" rx="3" fill="#bee3f8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="185.0" y="161.3" font-size="10.5" fill="#222" text-anchor="middle">128</text><text x="185.0" y="176.0" font-size="10.5" fill="#222" text-anchor="middle">H/2 x W/2</text><rect x="700.0" y="115.0" width="70.0" height="100.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="735.0" y="161.3" font-size="10.5" fill="#222" text-anchor="middle">128+128</text><text x="735.0" y="176.0" font-size="10.5" fill="#222" text-anchor="middle">-&gt;128</text><line x1="220.0" y1="165.0" x2="700.0" y2="165.0" stroke="#dd6b20" stroke-width="1.6" stroke-dasharray="6,4"/><polygon points="700.0,165.0 691.7,168.5 691.7,161.5" fill="#dd6b20"/><text x="460.0" y="159.0" font-size="10" fill="#dd6b20" text-anchor="middle">concatenazione (skip)</text><line x1="185.0" y1="215.0" x2="295.0" y2="190.0" stroke="#2b6cb0" stroke-width="1.6"/><polygon points="295.0,190.0 287.7,195.3 286.1,188.4" fill="#2b6cb0"/><line x1="625.0" y1="198.0" x2="735.0" y2="215.0" stroke="#2f855a" stroke-width="1.6"/><polygon points="735.0,215.0 726.3,217.2 727.3,210.3" fill="#2f855a"/><rect x="260.0" y="170.0" width="70.0" height="80.0" rx="3" fill="#bee3f8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="295.0" y="206.3" font-size="10.5" fill="#222" text-anchor="middle">256</text><text x="295.0" y="221.0" font-size="10.5" fill="#222" text-anchor="middle">H/4 x W/4</text><rect x="590.0" y="170.0" width="70.0" height="80.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="625.0" y="206.3" font-size="10.5" fill="#222" text-anchor="middle">256+256</text><text x="625.0" y="221.0" font-size="10.5" fill="#222" text-anchor="middle">-&gt;256</text><line x1="330.0" y1="210.0" x2="590.0" y2="210.0" stroke="#dd6b20" stroke-width="1.6" stroke-dasharray="6,4"/><polygon points="590.0,210.0 581.7,213.5 581.7,206.5" fill="#dd6b20"/><text x="460.0" y="204.0" font-size="10" fill="#dd6b20" text-anchor="middle">concatenazione (skip)</text><line x1="295.0" y1="250.0" x2="405.0" y2="235.0" stroke="#2b6cb0" stroke-width="1.6"/><polygon points="405.0,235.0 397.3,239.6 396.3,232.6" fill="#2b6cb0"/><line x1="515.0" y1="243.0" x2="625.0" y2="250.0" stroke="#2f855a" stroke-width="1.6"/><polygon points="625.0,250.0 616.5,253.0 616.9,246.0" fill="#2f855a"/><rect x="370.0" y="225.0" width="70.0" height="60.0" rx="3" fill="#bee3f8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="405.0" y="251.3" font-size="10.5" fill="#222" text-anchor="middle">512</text><text x="405.0" y="266.0" font-size="10.5" fill="#222" text-anchor="middle">H/8 x W/8</text><rect x="480.0" y="225.0" width="70.0" height="60.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="515.0" y="251.3" font-size="10.5" fill="#222" text-anchor="middle">512+512</text><text x="515.0" y="266.0" font-size="10.5" fill="#222" text-anchor="middle">-&gt;512</text><line x1="440.0" y1="255.0" x2="480.0" y2="255.0" stroke="#dd6b20" stroke-width="1.6" stroke-dasharray="6,4"/><polygon points="480.0,255.0 471.7,258.5 471.7,251.5" fill="#dd6b20"/><text x="460.0" y="249.0" font-size="10" fill="#dd6b20" text-anchor="middle">concatenazione (skip)</text><rect x="460.0" y="230.0" width="120.0" height="60.0" rx="3" fill="#feebc8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="520.0" y="256.3" font-size="10.5" fill="#222" text-anchor="middle">1024</text><text x="520.0" y="271.0" font-size="10.5" fill="#222" text-anchor="middle">H/16 x W/16</text><text x="40.0" y="52.0" font-size="11.5" fill="#2b6cb0" text-anchor="start" font-weight="bold">Discesa: conv + pooling/stride (campo recettivo cresce, si perde dettaglio spaziale)</text><text x="500.0" y="52.0" font-size="11.5" fill="#2f855a" text-anchor="start" font-weight="bold">Risalita: up-conv 2x2 + concat + conv (si ricostruisce la mappa ad alta risoluzione)</text><rect x="30.0" y="400.0" width="900.0" height="55.0" rx="3" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.2" opacity="1"/><text x="42.0" y="420.0" font-size="11" fill="#222" text-anchor="start">Uscita: conv 1x1 -&gt; C x H x W (C classi), poi argmax per pixel. Esempio H=W=256, C=21 (PASCAL VOC con sfondo): 21x256x256 = 1 376 256 punteggi.</text><text x="42.0" y="435.9" font-size="11" fill="#222" text-anchor="start">La skip connection concatena (non somma) le feature ad alta risoluzione dell'encoder: i canali del decoder raddoppiano e poi una conv li riporta a ch.</text></svg>