ont-size="12" fill="#222" text-anchor="middle">w3</text><text x="30.0" y="218.0" font-size="11" fill="#718096" text-anchor="start">riga i = filtro posto in 2i-1 (il padding "taglia" w1 nella riga 0)</text><text x="500.0" y="55.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold">C^T  (6 x 3):  x' = C^T y   (m=3 -&gt; 6)</text><rect x="500.0" y="70.0" width="42.0" height="42.0" rx="0" fill="#feebc8" stroke="#444" stroke-width="1" opacity="1"/><text x="521.0" y="95.2" font-size="12" fill="#222" text-anchor="middle">w2</text><rect x="542.0" y="70.0" width="42.0" height="42.0" rx="0" fill="#fff" stroke="#444" stroke-width="1" opacity="1"/><text x="563.0" y="95.2" font-size="12" fill="#222" text-anchor="middle">.</text><rect x="584.0" y="70.0" width="42.0" height="42.0" rx="0" fill="#fff" stroke="#444" stroke-width="1" opacity="1"/><text x="605.0" y="95.2" font-size="12" fill="#222" text-anchor="middle">.</text><rect x="500.0" y="112.0" width="42.0" height="42.0" rx="0" fill="#feebc8" stroke="#444" stroke-width="1" opacity="1"/><text x="521.0" y="137.2" font-size="12" fill="#222" text-anchor="middle">w3</text><rect x="542.0" y="112.0" width="42.0" height="42.0" rx="0" fill="#feebc8" stroke="#444" stroke-width="1" opacity="1"/><text x="563.0" y="137.2" font-size="12" fill="#222" text-anchor="middle">w1</text><rect x="584.0" y="112.0" width="42.0" height="42.0" rx="0" fill="#fff" stroke="#444" stroke-width="1" opacity="1"/><text x="605.0" y="137.2" font-size="12" fill="#222" text-anchor="middle">.</text><rect x="500.0" y="154.0" width="42.0" height="42.0" rx="0" fill="#fff" stroke="#444" stroke-width="1" opacity="1"/><text x="521.0" y="179.2" font-size="12" fill="#222" text-anchor="middle">.</text><rect x="542.0" y="154.0" width="42.0" height="42.0" rx="0" fill="#feebc8" stroke="#444" stroke-width="1" opacity="1"/><text x="563.0" y="179.2" font-size="12" fill="#222" text-anchor="middle">w2</text><rect x="584.0" y="154.0" width="42.0" height="42.0" rx="0" fi