r="start">ogni colonna = copia del filtro: e la convoluzione trasposta</text><rect x="30.0" y="230.0" width="440.0" height="150.0" rx="3" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.2" opacity="1"/><text x="42.0" y="252.0" font-size="11.5" fill="#222" text-anchor="start">Esempio numerico: w=(1,2,3), x=(1,...,6)</text><text x="42.0" y="268.7" font-size="11.5" fill="#222" text-anchor="start">  y = C x      = [8, 20, 32]</text><text x="42.0" y="285.4" font-size="11.5" fill="#222" text-anchor="start">  C^T y        = [16, 44, 40, 92, 64, 96]</text><text x="42.0" y="302.0" font-size="11.5" fill="#222" text-anchor="start">C^T NON e l'inversa di C: riporta le dimensioni</text><text x="42.0" y="318.7" font-size="11.5" fill="#222" text-anchor="start">originali (3 -&gt; 6) ma non i valori. E un operatore di</text><text x="42.0" y="335.4" font-size="11.5" fill="#222" text-anchor="start">upsampling con kernel APPRESO.</text><rect x="500.0" y="330.0" width="440.0" height="55.0" rx="3" fill="#c6f6d5" stroke="#38a169" stroke-width="1.2" opacity="1"/><text x="512.0" y="350.0" font-size="11.5" fill="#222" text-anchor="start">Nel backward di una convoluzione si moltiplica per C^T:</text><text x="512.0" y="366.7" font-size="11.5" fill="#222" text-anchor="start">la conv trasposta e quindi il "gradiente della convoluzione".</text></svg>