ze="8.5" fill="#222" text-anchor="middle">3xHxW</text><line x1="522.0" y1="155.0" x2="532.0" y2="155.0" stroke="#333" stroke-width="1.6"/><polygon points="532.0,155.0 523.7,158.5 523.7,151.5" fill="#333"/><rect x="532.0" y="122.0" width="52.0" height="66.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="558.0" y="202.0" font-size="8.5" fill="#222" text-anchor="middle">D1xH/2xW/2</text><line x1="584.0" y1="155.0" x2="594.0" y2="155.0" stroke="#333" stroke-width="1.6"/><polygon points="594.0,155.0 585.7,158.5 585.7,151.5" fill="#333"/><rect x="594.0" y="132.0" width="52.0" height="46.0" rx="3" fill="#feebc8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="620.0" y="192.0" font-size="8.5" fill="#222" text-anchor="middle">D2xH/4xW/4</text><line x1="646.0" y1="155.0" x2="656.0" y2="155.0" stroke="#333" stroke-width="1.6"/><polygon points="656.0,155.0 647.7,158.5 647.7,151.5" fill="#333"/><rect x="656.0" y="132.0" width="52.0" height="46.0" rx="3" fill="#feebc8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="682.0" y="192.0" font-size="8.5" fill="#222" text-anchor="middle">D3xH/4xW/4</text><line x1="708.0" y1="155.0" x2="718.0" y2="155.0" stroke="#333" stroke-width="1.6"/><polygon points="718.0,155.0 709.7,158.5 709.7,151.5" fill="#333"/><rect x="718.0" y="132.0" width="52.0" height="46.0" rx="3" fill="#feebc8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="744.0" y="192.0" font-size="8.5" fill="#222" text-anchor="middle">D2xH/4xW/4</text><line x1="770.0" y1="155.0" x2="780.0" y2="155.0" stroke="#333" stroke-width="1.6"/><polygon points="780.0,155.0 771.7,158.5 771.7,151.5" fill="#333"/><rect x="780.0" y="122.0" width="52.0" height="66.0" rx="3" fill="#c6f6d5" stroke="#333" stroke-width="1.2" opacity="1"/><text x="806.0" y="202.0" font-size="8.5" fill="#222" text-anchor="middle">D1xH/2xW/2</text><line x1="832.0" y1="155.0" x2="842.0" y2="155.0" stroke="#333" stroke-width="1.6"/><polygon points="842.0,155.0 833.7,158.5 833.7,151.5" fill="#333"/><rect x="842.0" y="110.0" width="52.0" height="90.0" rx="3" fill="#bee3f8" stroke="#333" stroke-width="1.2" opacity="1"/><text x="868.0" y="214.0" font-size="8.5" fill="#222" text-anchor="middle">CxHxW</text><text x="470.0" y="250.0" font-size="11.5" fill="#718096" text-anchor="start">argmax sui C canali -&gt; mappa H x W di etichette</text><rect x="470.0" y="270.0" width="410.0" height="110.0" rx="3" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.2" opacity="1"/><text x="480.0" y="290.0" font-size="11" fill="#222" text-anchor="start">Costo di un conv 3x3, 64-&gt;64 canali, su un'immagine 224x224:</text><text x="480.0" y="305.9" font-size="11" fill="#222" text-anchor="start">  a risoluzione piena      : 3.70 GFLOPs</text><text x="480.0" y="321.9" font-size="11" fill="#222" text-anchor="start">  a meta risoluzione (/2)  : 0.92 GFLOPs  (4x meno)</text><text x="480.0" y="337.9" font-size="11" fill="#222" text-anchor="start">  a un quarto (/4)         : 0.23 GFLOPs  (16x meno)</text><text x="480.0" y="353.8" font-size="11" fill="#222" text-anchor="start">Downsampling dentro la rete =&gt; convoluzioni economiche e campo recettivo ampio.</text></svg>