[project]
name = "computer-science-sapienza"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "d2l>=0.17.0",
    "datasets>=5.1.0",
    "huggingface-hub>=2.2.0",
    "imagehash>=4.3.2",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.6",
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
    "pillow>=12.0.0",
    "plotly>=6.5.0",
    "pytorch-lightning>=2.6.6",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "shap>=0.50.0",
    "torch>=2.6",
    "torchmetrics[detection]>=1.8.2",
    "torchvision>=0.21",
    "tqdm>=4.67.1",
    "transformers>=5.21.0",
    "ultralytics>=8.3.235",
    "wandb>=0.23.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv.workspace]
members = [
    "Advanced Machine Learning/personal notes/challenge",
    "Advanced Machine Learning/personal notes/detection and segmentation",
]

[tool.uv]
index-strategy = "unsafe-best-match"
